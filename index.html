<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilyonVIP - Canlı İddaa Analiz & Monte Carlo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            padding-bottom: 85px;
        }
        .header {
            background: linear-gradient(135deg, #102e1b 0%, #161b22 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #21262d;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .header-icons i {
            font-size: 18px;
            margin-left: 15px;
            color: #8b949e;
            cursor: pointer;
        }
        .hero {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .date-badge {
            background-color: #0e3a24;
            color: #2ea043;
            border: 1px solid #238636;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .nav-tabs {
            display: flex;
            background-color: #161b22;
            border-bottom: 2px solid #21262d;
            overflow-x: auto;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 700;
            color: #8b949e;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-item.active {
            color: #3fb950;
            border-bottom: 3px solid #3fb950;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .match-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .team-name {
            font-size: 17px;
            font-weight: 800;
            width: 42%;
        }
        .team-name.home {
            text-align: left;
        }
        .team-name.away {
            text-align: right;
        }
        .vs-badge {
            font-size: 12px;
            color: #8b949e;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-box {
            background-color: #0d1117;
            border-radius: 8px;
            padding: 10px;
        }
        .stat-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .stat-val {
            font-size: 15px;
            font-weight: 700;
            color: #3fb950;
        }
        .prediction-banner {
            background-color: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #3fb950;
        }
        .telegram-btn {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,136,204,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">BilyonVIP +</div>
        <div class="header-icons">
            <i class="fas fa-share-alt"></i>
            <i class="fas fa-bell"></i>
        </div>
    </div>

    <div class="hero">
        <div class="logo-text">BİLYONVIP</div>
        <div class="date-badge">• 27 Eylül Paz</div>
    </div>

    <div class="nav-tabs">
        <div class="tab-item active"><i class="fas fa-football-ball"></i> CANLI BÜLTEN</div>
        <div class="tab-item"><i class="fas fa-dice"></i> MONTE CARLO (5000)</div>
        <div class="tab-item"><i class="fas fa-chart-bar"></i> SPOR TOTO</div>
    </div>

    <div class="container" id="matchesContainer">
        <!-- JS Maçları Anında Yükler -->
    </div>

    <a href="https://t.me/bilyonvip" target="_blank" class="telegram-btn">
        <i class="fab fa-telegram-plane"></i>
        CANLI VIP TAHMİNLER İÇİN TELEGRAM'A KATIL
    </a>

    <script>
        function poissonSample(lambda) {
            let L = Math.exp(-lambda);
            let k = 0;
            let p = 1.0;
            do {
                k++;
                p *= Math.random();
            } while (p > L);
            return k - 1;
        }

        function runMonteCarlo(homeXg, awayXg, simulations = 5000) {
            let scoreCounts = {};
            let over25Count = 0;
            for (let i = 0; i < simulations; i++) {
                let hG = poissonSample(homeXg);
                let aG = poissonSample(awayXg);
                let key = `${hG} - ${aG}`;
                scoreCounts[key] = (scoreCounts[key] || 0) + 1;
                if ((hG + aG) > 2.5) over25Count++;
            }
            let sortedScores = Object.entries(scoreCounts).sort((a,b) => b[1] - a[1]);
            let top1 = sortedScores[0] ? sortedScores[0][0] : "1 - 0";
            let top2 = sortedScores[1] ? sortedScores[1][0] : top1;
            let probOver = ((over25Count / simulations) * 100).toFixed(1);
            let probUnder = (100 - parseFloat(probOver)).toFixed(1);
            return {
                probOver: probOver,
                probUnder: probUnder,
                exactScore: top1,
                backupScore: top2,
                prediction: parseFloat(probOver) >= 52.0 ? "2.5 ÜST" : "2.5 ALT"
            };
        }

        // 27 EYLÜL GERÇEK BÜLTEN MAÇLARI
        const todayFixtures = [
            { home: "Sırbistan", away: "Hollanda", hXg: 1.25, aXg: 2.10 },
            { home: "Almanya", away: "Yunanistan", hXg: 2.35, aXg: 0.85 },
            { home: "Danimarka", away: "Galler", hXg: 1.75, aXg: 1.05 },
            { home: "Norveç", away: "Portekiz", hXg: 1.45, aXg: 1.85 },
            { home: "Avusturya", away: "Kosova", hXg: 2.10, aXg: 0.90 },
            { home: "Litvanya", away: "Azerbaycan", hXg: 1.15, aXg: 1.10 },
            { home: "Cebelitarık", away: "Andorra", hXg: 0.95, aXg: 0.90 },
            { home: "İsrail", away: "İrlanda", hXg: 1.30, aXg: 1.25 },
            { home: "Karacabey Bld.", away: "MKE Ankaragücü", hXg: 1.10, aXg: 1.55 },
            { home: "Sakaryaspor", away: "Kütahyaspor", hXg: 1.65, aXg: 0.95 },
            { home: "Türkiye", away: "İtalya", hXg: 1.50, aXg: 1.65 }
        ];

        function renderMatches() {
            const container = document.getElementById("matchesContainer");
            container.innerHTML = "";

            todayFixtures.forEach(match => {
                const sim = runMonteCarlo(match.hXg, match.aXg);
                const card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = `
                    <div class="match-header">
                        <div class="team-name home">${match.home}</div>
                        <div class="vs-badge">VS</div>
                        <div class="team-name away">${match.away}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">2.5 ÜST Olasılığı</div>
                            <div class="stat-val">%${sim.probOver}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">2.5 ALT Olasılığı</div>
                            <div class="stat-val">%${sim.probUnder}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Muhtemel Skor</div>
                            <div class="stat-val">${sim.exactScore}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Yedek Skor</div>
                            <div class="stat-val">${sim.backupScore}</div>
                        </div>
                    </div>
                    <div class="prediction-banner">
                        🎯 TAHMİN: ${sim.prediction}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        renderMatches();
    </script>
</body>
</html>
