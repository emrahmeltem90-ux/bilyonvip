    <script>
        let globalMatches = [];

        async function fetchAndRenderMatches() {
            const feed = document.getElementById('matchFeed');
            feed.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>Bülten yükleniyor...</div>";

            try {
                const response = await fetch('matches.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Veri yüklenemedi');
                
                const data = await response.json();
                globalMatches = data.matches || [];
                renderMatches(globalMatches);
            } catch (error) {
                console.error("Hata:", error);
                feed.innerHTML = "<div style='text-align:center; color:#ef4444; padding:20px;'>Bülten yüklenirken bir hata oluştu.</div>";
            }
        }

        function renderMatches(matches) {
            const feed = document.getElementById('matchFeed');
            feed.innerHTML = "";
            
            if (!matches || matches.length === 0) {
                feed.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>Aktif maç bulunamadı.</div>";
                return;
            }

            matches.forEach((m, index) => {
                const home = m.home_team || m.home || "Ev Sahibi";
                const away = m.away_team || m.away || "Deplasman";
                const score = m.score || "VS";
                const time = m.time || m.date || "";
                const league = m.league || "Lig";
                
                let aiText = "";
                if (typeof m.ai === 'string') {
                    aiText = m.ai;
                } else if (m.poisson) {
                    aiText = `Poisson: ${m.poisson.rate} ${m.poisson.prediction} (Güven: ${m.poisson.confidence})`;
                } else {
                    aiText = "Poisson analizi hazırlanıyor";
                }

                feed.innerHTML += `
                    <div class="match-card" onclick="openModal(${index})">
                        <div class="match-header">
                            <span>${league}</span>
                            <span>${time} 🔍 Matris</span>
                        </div>
                        <div class="match-teams">
                            <span>${home}</span>
                            <span class="match-score-time">${score}</span>
                            <span style="text-align:right;">${away}</span>
                        </div>
                        <div class="ai-bar">
                            <span style="color:#6ee7b7; font-weight:700;">⚡ ${aiText}</span>
                            <span class="ai-val">İncele ></span>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const m = globalMatches[index];
            if (!m) return;

            const home = m.home_team || m.home || "Ev Sahibi";
            const away = m.away_team || m.away || "Deplasman";
            const league = m.league || "Lig";
            const matrix = m.matrix || ["1-0", "2-0", "1-1"];

            document.getElementById('modalLeague').innerText = league;
            document.getElementById('modalTeams').innerText = `${home} vs ${away}`;
            
            let matrixHtml = '';
            matrix.forEach((scoreVal, idx) => {
                let prob = idx === 0 ? "%11/12 (En Yüksek)" : (idx === 1 ? "%8/12" : "%6/12");
                matrixHtml += `
                    <div class="matrix-box">
                        <div class="matrix-score">${scoreVal}</div>
                        <div class="matrix-prob">${prob}</div>
                    </div>
                `;
            });
            document.getElementById('modalMatrix').innerHTML = matrixHtml;
            document.getElementById('matchModal').style.display = 'flex';
        }

        function closeModal(e) {
            if(e.target.id === 'matchModal') document.getElementById('matchModal').style.display = 'none';
        }
        function closeModalForce() {
            document.getElementById('matchModal').style.display = 'none';
        }

        fetchAndRenderMatches();
    </script>
