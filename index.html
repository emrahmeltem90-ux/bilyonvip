<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>SkorLab · Tahmin Oyunu</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=24">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ÜST PROFİL BARI -->
<header class="profil-bar">
  <div class="pb-avatar" id="pbAvatar">👤</div>
  <div class="pb-bilgi">
    <div class="pb-isim" id="pbIsim">Oyuncu</div>
    <div class="pb-seviye" id="pbSeviye">🥉 Çaylak</div>
  </div>
  <div class="pb-kasa">
    <div class="pb-coin" id="pbCoin">💰 1.000</div>
    <div class="pb-seri" id="pbSeri">🔥 1 gün</div>
  </div>
</header>

<!-- TAB MENÜ -->
<nav class="tabs">
  <button type="button" class="tab active" onclick="switchTab(1,this)">🎰 Toto</button>
  <button type="button" class="tab" onclick="switchTab(2,this)">⚽ Tahmin</button>
  <button type="button" class="tab" onclick="switchTab(3,this)">💾 Kuponlar</button>
  <button type="button" class="tab" onclick="switchTab(4,this)">🏆 Sıralama</button>
  <button type="button" class="tab" onclick="switchTab(5,this)">👑 VIP</button>
</nav>

<main>

<!-- SAYFA 1: TOTO (KLASİK) -->
<section id="page-1" class="page active">
  <div class="kasa-kart">
    <div class="kasa-baslik">💰 KASAM</div>
    <div class="kasa-bakiye" id="totoKasa">1.000</div>
    <div class="kasa-alt">SkorCoin</div>
    <div class="kasa-istatistik">
      <div><b id="totoKolon">0</b><span>KOLON</span></div>
      <div><b id="totoMaliyet">0</b><span>MALİYET</span></div>
      <div><b id="totoLimit">2500</b><span>MAKS</span></div>
    </div>
  </div>

  <div class="page-actions">
    <button type="button" class="btn btn-gold" onclick="carkifelekAc()">🎡 ÇARKIFELEK</button>
    <button type="button" class="btn btn-blue" onclick="sonuclariGirAc()">📝 SONUÇ GİR</button>
    <button type="button" class="btn btn-green" onclick="totoKaydet()" style="grid-column:1/-1">✅ TOTOYU KAYDET</button>
  </div>

  <div id="totoListesi"></div>
</section>

<!-- SAYFA 2: TAHMİN -->
<section id="page-2" class="page">
  <div class="kasa-kart">
    <div class="kasa-baslik">💰 KASAM</div>
    <div class="kasa-bakiye" id="ligKasa">1.000</div>
    <div class="kasa-alt">SkorCoin</div>
    <div class="kasa-istatistik">
      <div><b id="ligTaraf">0</b><span>TARAF</span></div>
      <div><b id="ligSkor">0</b><span>SKOR</span></div>
      <div><b id="ligToplam">0</b><span>TOPLAM</span></div>
    </div>
  </div>

  <div class="page-actions">
    <button type="button" class="btn btn-gold" onclick="carkifelekAc()">🎡 ÇARKIFELEK</button>
    <button type="button" class="btn btn-purple" onclick="jokerleriGoster()">🃏 JOKERLER</button>
    <button type="button" class="btn btn-green" onclick="tahminleriKaydet()" style="grid-column:1/-1">✅ TAHMİNLERİ KAYDET</button>
  </div>

  <div id="ligListesi"></div>
</section>

<!-- SAYFA 3: KUPONLAR -->
<section id="page-3" class="page">
  <div class="card">
    <div class="result-title">💾 KUPONLARIM</div>
    <div id="kayitliKuponlar"></div>
  </div>
</section>

<!-- SAYFA 4: SIRALAMA -->
<section id="page-4" class="page">
  <div class="card">
    <div class="result-title">🏆 LİDERLİK</div>
    <div id="siralamaListesi"></div>
  </div>
  <div class="card">
    <div class="result-title">🎖️ ROZETLERİM</div>
    <div id="rozetListesi"></div>
  </div>
</section>

<!-- SAYFA 5: VIP -->
<section id="page-5" class="page">
  <div id="vipListesi"></div>
</section>

</main>

<!-- ALT KUPON ÇUBUĞU -->
<div class="kupon-cubugu" id="kuponCubugu">
  <div class="kc-info">
    <div class="kc-satir"><span>Bahis</span><b id="kcToto">0</b></div>
    <div class="kc-satir"><span>Toplam</span><b id="kcToplam">0 💰</b></div>
  </div>
  <div class="kc-butonlar">
    <button type="button" class="btn btn-red btn-sm" onclick="tumSecimleriSil()">🗑️</button>
    <button type="button" class="btn btn-green" onclick="paylasKupon()">📤</button>
  </div>
</div>

<!-- MODAL: ÇARKIFELEK -->
<div class="modal" id="carkModal">
  <div class="modal-content">
    <div class="modal-head">
      <span>🎡 ÇARKIFELEK</span>
      <button type="button" onclick="closeModal('carkModal')">✖</button>
    </div>
    <div class="modal-body" id="carkBody"></div>
  </div>
</div>

<!-- MODAL: JOKERLER -->
<div class="modal" id="jokerModal">
  <div class="modal-content">
    <div class="modal-head">
      <span>🃏 JOKERLERİM</span>
      <button type="button" onclick="closeModal('jokerModal')">✖</button>
    </div>
    <div class="modal-body" id="jokerBody"></div>
  </div>
</div>

<!-- MODAL: SONUÇ GİR -->
<div class="modal" id="sonucModal">
  <div class="modal-content">
    <div class="modal-head">
      <span>📝 SONUÇ GİR</span>
      <button type="button" onclick="closeModal('sonucModal')">✖</button>
    </div>
    <div class="modal-body" id="sonucBody"></div>
  </div>
</div>

<!-- MODAL: KUPON DETAY -->
<div class="modal" id="kuponDetayModal">
  <div class="modal-content">
    <div class="modal-head">
      <span>💾 KUPON DETAY</span>
      <button type="button" onclick="closeModal('kuponDetayModal')">✖</button>
    </div>
    <div class="modal-body" id="kuponDetayBody"></div>
  </div>
</div>

<!-- MODAL: TOAST -->
<div class="modal" id="toastModal">
  <div class="modal-content small">
    <div class="modal-body center">
      <div id="toastIcon" style="font-size:2.5rem">✅</div>
      <div id="toastTitle" style="font-weight:900;margin:8px 0"></div>
      <div id="toastMsg" class="muted"></div>
      <button type="button" class="btn btn-blue" onclick="closeModal('toastModal')" style="margin-top:12px">TAMAM</button>
    </div>
  </div>
</div>

<!-- ANİMASYON KATMANLARI -->
<div id="konfetiKatman" class="konfeti-katman"></div>
<div id="ucanKatman" class="ucan-katman"></div>

<script src="app.js?v=24"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
