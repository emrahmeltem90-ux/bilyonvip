<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>BilyonVIP - Profesyonel İddaa & Spor Toto Analiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #102e1b 0%, #161b22 100%); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; }
        .header-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .header-icons i { font-size: 18px; margin-left: 15px; color: #8b949e; }
        .hero { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #161b22; border-bottom: 1px solid #21262d; }
        .logo-text { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #ffffff; }
        .date-badge { background-color: #0e3a24; color: #2ea043; border: 1px solid #238636; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .nav-tabs { display: flex; background-color: #161b22; border-bottom: 2px solid #21262d; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 4px; font-size: 12px; font-weight: 700; color: #8b949e; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #3fb950; border-bottom-color: #3fb950; }
        .container { padding: 12px; max-width: 600px; margin: 0 auto; }
        .match-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .team-name { font-size: 15px; font-weight: 800; width: 42%; }
        .team-name.home { text-align: left; }
        .team-name.away { text-align: right; }
        .vs-badge { font-size: 11px; color: #8b949e; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-box { background-color: #0d1117; border-radius: 6px; padding: 8px; }
        .stat-label { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
        .stat-val { font-size: 14px; font-weight: 700; color: #3fb950; }
        .prediction-banner { background-color: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px; text-align: center; font-size: 13px; font-weight: 800; color: #3fb950; }
        .toto-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; }
        .toto-table th { background-color: #21262d; color: #8b949e; padding: 8px; text-align: left; }
        .toto-table td { padding: 10px 8px; border-bottom: 1px solid #21262d; }
        .toto-pick { background-color: #238636; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .telegram-btn { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background-color: #0088cc; color: #ffffff; text-decoration: none; padding: 13px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 13px; box-shadow: 0 4px 15px rgba(0,136,204,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 999; }
        
        /* Skeleton Loading Effect */
        .skeleton { background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 8px; height: 110px; margin-bottom: 12px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">BilyonVIP +</div>
        <div class="header-icons"><i class="fas fa-share-alt"></i><i class="fas fa-bell"></i></div>
    </div>

    <div class="hero">
        <div class="logo-text">BİLYONVIP</div>
        <div class="date-badge">• 27 Eylül Paz</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('bulten', this)">⚽ CANLI BÜLTEN</button>
        <button class="tab-btn" onclick="switchTab('monte', this)">🎲 MONTE CARLO (5000)</button>
        <button class="tab-btn" onclick="switchTab('toto', this)">📊 SPOR TOTO (15)</button>
    </div>

    <div class="container" id="mainContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <a href="https://t.me/bilyonvip" target="_blank" class="telegram-btn">
        <i class="fab fa-telegram-plane"></i> CANLI VIP TAHMİNLER İÇİN TELEGRAM'A KATIL
    </a>

    <script>
        let globalMatches = [];
        let currentTab = 'bulten';

        // İstemci Yedek Veri & Simülasyon Motoru (API yanıt vermezse asla kilitlenmez)
        const fallbackFixtures = [
            { home: "Türkiye", away: "İtalya", h_xg: 1.50, a_xg: 1.65 },
            { home: "Sırbistan", away: "Hollanda", h_xg: 1.25, a_xg: 2.10 },
            { home: "Almanya", away: "Yunanistan", h_xg: 2.35, a_xg: 0.85 },
            { home: "Danimarka", away: "Galler", h_xg: 1.75, a_xg: 1.05 },
            { home: "Norveç", away: "Portekiz", h_xg: 1.45, a_xg: 1.85 },
            { home: "Avusturya", away: "Kosova", h_xg: 2.10, a_xg: 0.90 },
            { home: "Litvanya", away: "Azerbaycan", h_xg: 1.15, a_xg: 1.10 },
            { home: "Cebelitarık", away: "Andorra", h_xg: 0.95, a_xg: 0.90 },
            { home: "İsrail", away: "İrlanda", h_xg: 1.30, a_xg: 1.25 },
            { home: "Karacabey Bld.", away: "Ankaragücü", h_xg: 1.10, a_xg: 1.55 },
            { home: "Sakaryaspor", away: "Kütahyaspor", h_xg: 1.65, a_xg: 0.95 },
            { home: "İsveç", away: "Romanya", h_xg: 1.80, a_xg: 0.95 },
            { home: "İtalya", away: "Belçika", h_xg: 1.60, a_xg: 1.40 },
            { home: "Fransa", away: "İspanya", h_xg: 1.70, a_xg: 1.60 },
            { home: "İngiltere", away: "Hırvatistan", h_xg: 1.90, a_xg: 1.10 }
        ];

        function poissonSample(lambda) {
            let L = Math.exp(-lambda), k = 0, p = 1.0;
            do { k++; p *= Math.random(); } while (p > L);
            return k - 1;
        }

        function calculateLocalSim(home, away, hXg, aXg) {
            let scoreCounts = {}, over25 = 0, winH = 0, draw = 0, winA = 0;
            for (let i = 0; i < 5000; i++) {
                let hG = poissonSample(hXg), aG = poissonSample(aXg);
                scoreCounts[`${hG} - ${aG}`] = (scoreCounts[`${hG} - ${aG}`] || 0) + 1;
                if ((hG + aG) > 2.5) over25++;
                if (hG > aG) winH++; else if (hG === aG) draw++; else winA++;
            }
            let sorted = Object.entries(scoreCounts).sort((a,b) => b[1] - a[1]);
            let pOver = ((over25 / 5000) * 100).toFixed(1);
            let pH = ((winH / 5000) * 100).toFixed(1);
            let pD = ((draw / 5000) * 100).toFixed(1);
            let pA = ((winA / 5000) * 100).toFixed(1);
            return {
                home: home, away: away,
                p_over25: pOver, p_under25: (100 - pOver).toFixed(1),
                p_home: pH, p_draw: pD, p_away: pA,
                exact_score: sorted[0] ? sorted[0][0] : "1 - 0",
                backup_score: sorted[1] ? sorted[1][0] : "1 - 1",
                prediction_25: parseFloat(pOver) >= 52.0 ? "2.5 ÜST" : "2.5 ALT",
                prediction_1x2: parseFloat(pH) >= Math.max(parseFloat(pD), parseFloat(pA)) ? "1" : (parseFloat(pD) >= parseFloat(pA) ? "X" : "2")
            };
        }

        async function fetchMatches() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 saniye zaman aşımı

            try {
                // Render API adresi
                const res = await fetch("https://bilyonvip.onrender.com", { signal: controller.signal });
                const data = await res.json();
                clearTimeout(timeoutId);

                if (data.status === "success" && data.matches && data.matches.length > 0) {
                    globalMatches = data.matches;
                } else {
                    useFallback();
                }
            } catch (err) {
                useFallback();
            }
            renderView();
        }

        function useFallback() {
            globalMatches = fallbackFixtures.map(f => calculateLocalSim(f.home, f.away, f.h_xg, f.a_xg));
        }

        function renderView() {
            const container = document.getElementById("mainContainer");
            let html = "";

            if (currentTab === 'bulten') {
                globalMatches.slice(0, 10).forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <div class="team-name home">${m.home}</div>
                                <div class="vs-badge">VS</div>
                                <div class="team-name away">${m.away}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-label">2.5 ÜST Olasılığı</div><div class="stat-val">%${m.p_over25}</div></div>
                                <div class="stat-box"><div class="stat-label">2.5 ALT Olasılığı</div><div class="stat-val">%${m.p_under25}</div></div>
                                <div class="stat-box"><div class="stat-label">Muhtemel Skor</div><div class="stat-val">${m.exact_score}</div></div>
                                <div class="stat-box"><div class="stat-label">Yedek Skor</div><div class="stat-val">${m.backup_score}</div></div>
                            </div>
                            <div class="prediction-banner">🎯 TAHMİN: ${m.prediction_25}</div>
                        </div>`;
                });
            } else if (currentTab === 'monte') {
                globalMatches.slice(0, 10).forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <div class="team-name home">${m.home}</div>
                                <div class="vs-badge">5000 İTERASYON</div>
                                <div class="team-name away">${m.away}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-label">1 (Ev Sahibi)</div><div class="stat-val">%${m.p_home}</div></div>
                                <div class="stat-box"><div class="stat-label">X (Beraberlik)</div><div class="stat-val">%${m.p_draw}</div></div>
                                <div class="stat-box"><div class="stat-label">2 (Deplasman)</div><div class="stat-val">%${m.p_away}</div></div>
                                <div class="stat-box"><div class="stat-label">En Yüksek Olasılık</div><div class="stat-val">MS ${m.prediction_1x2}</div></div>
                            </div>
                        </div>`;
                });
            } else if (currentTab === 'toto') {
                html = `<div class="match-card"><h3 style="margin-bottom:10px; font-size:15px; color:#3fb950;">📊 SPOR TOTO 15 MAÇ HESAPLANMIŞ KOLON</h3><table class="toto-table"><thead><tr><th>#</th><th>Maç</th><th>1X2 Tahmin</th></tr></thead><tbody>`;
                globalMatches.forEach((m, idx) => {
                    html += `<tr><td>${idx+1}</td><td>${m.home} - ${m.away}</td><td><span class="toto-pick">${m.prediction_1x2}</span></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }

            container.innerHTML = html;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentTab = tab;
            renderView();
        }

        // İlk Yükleme
        fetchMatches();
    </script>
</body>
</html>
