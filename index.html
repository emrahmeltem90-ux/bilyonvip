<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hedef 15 - Akıllı Redüksiyon Sistemi</title>
<style>
:root{--green:#008751;--green2:#00a866;--bg:#0f172a;--card:#1e293b;--card2:#162032;--text:#f8fafc;--muted:#94a3b8;--orange:#f59e0b;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Segoe UI,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:50px}
header{background:var(--green);padding:17px 12px;text-align:center}
header h2{font-size:1.15rem}header span{font-size:.75rem;opacity:.85}
.tabs{display:flex;background:var(--card2);position:sticky;top:0;z-index:20}
.tab{flex:1;text-align:center;padding:14px 4px;font-size:.75rem;font-weight:bold;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.container{max-width:650px;margin:auto;padding:12px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:12px;overflow-wrap:anywhere}
label{display:block;color:var(--muted);font-size:.78rem;font-weight:bold;margin-bottom:5px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:#fff;font-size:1rem;font-weight:bold;margin-bottom:12px;outline:none}
button{width:100%;padding:13px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:.95rem;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.5}
.match{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:9px}
.match-head{display:flex;justify-content:space-between;color:var(--orange);font-size:.7rem;font-weight:bold;margin-bottom:7px}
.teams{font-weight:bold;font-size:.92rem;margin-bottom:8px}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 4px;text-align:center;font-weight:bold;font-size:.85rem;cursor:pointer;user-select:none}
.pick span{display:block;font-size:.68rem;color:#10b981;margin-top:2px}
.pick.selected{background:var(--green);border-color:var(--green2)}
.pick.selected span{color:#e2e8f0}
.bar-info{display:flex;justify-content:space-between;background:var(--card2);border:1px solid var(--border);padding:12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
.bar-info b{color:var(--orange)}
.result-title{color:var(--orange);font-weight:bold;font-size:.95rem;margin-bottom:8px}
.coupon{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.78rem;line-height:1.7}
.coupon b{color:var(--orange)}
.badge{display:inline-block;padding:3px 7px;border-radius:5px;background:rgba(245,158,11,.15);color:var(--orange);font-size:.68rem;font-weight:bold}
.green{color:#10b981}.muted{color:var(--muted)}
.progress{height:8px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:7px}
.progress div{height:100%;background:var(--green);width:0}
.hrow{display:grid;grid-template-columns:40px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:.8rem}
.hbar{height:14px;background:var(--orange);border-radius:3px;min-width:2px}
.note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:8px}
/* Bankobot sohbet */
#chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.b{max-width:92%;padding:10px 12px;border-radius:12px;font-size:.82rem;line-height:1.6;overflow-wrap:anywhere}
.b.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.b.usr{background:var(--green);align-self:flex-end}
.b button{margin-top:8px;padding:9px;font-size:.8rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--border);color:var(--orange);border-radius:16px;padding:7px 11px;font-size:.75rem;font-weight:bold;cursor:pointer}
.askrow{display:flex;gap:8px}
.askrow input{margin:0}.askrow button{width:90px}
</style>
</head>
<body>
<header><h2>HEDEF 15 - AKILLI REDÜKSİYON</h2><span>Poisson &amp; Optimizasyon Matrisi</span></header>
<nav class="tabs">

<div class="tab" onclick="switchTab(1,this)">2. Bankobot Analiz</div>
<div class="tab" onclick="switchTab(2,this)">3. Monte Carlo Lab</div>
</nav>
<div class="container">
<div class="page active" id="page-0">
<div id="matchesList"></div>

<div class="bar-info"><div>Tutar: <b id="lblCost">200 TL</b></div><div>Kolon: <b id="lblCount">20</b></div><div>Kapama alanı: <b id="lblSpace">-</b></div></div>
<button onclick="generate()">Hemen Oluştur</button>
</div>
<div class="card" id="outputCard" style="display:none">
<div class="result-title">Süzülmüş Optimizasyon Raporu</div>
<div id="outputSummary" class="muted" style="font-size:.8rem;margin-bottom:8px"></div>
