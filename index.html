<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>SkorLab v16</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="app-header" id="appHeader">
  <div class="logo">⚽ SKORLAB <span class="v">v16</span></div>
  <div id="weekTitle" class="week">Yükleniyor...</div>
</header>

<div class="kasa-bar">
  <span>💰 Bütçe:</span>
  <input type="number" id="butceInput" value="100" step="10" oninput="butceGuncelle(this.value)">
  <span>TL</span>
  <span class="kasa-sep">·</span>
  <button class="btn btn-blue btn-mini" onclick="otomatikKuponAc()">⚡ OTOMATİK</button>
</div>

<nav class="tabs">
  <button class="tab active" onclick="switchTab(1,this)">📋 Bülten</button>
  <button class="tab" onclick="switchTab(2,this)">🎯 Serbest</button>
  <button class="tab" onclick="switchTab(3,this)">💾 Kuponlarım</button>
  <button class="tab" onclick="switchTab(4,this)">🆚 Karşılaştır</button>
</nav>

<main>

<!-- SAYFA 1: BÜLTEN -->
<section id="page-1" class="page active">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="statMac">0</div><div class="stat-lbl">MAÇ</div></div>
    <div class="stat-card"><div class="stat-val blue" id="statSecilen">0</div><div class="stat-lbl">SEÇİLEN</div></div>
    <div class="stat-card"><div class="stat-val green" id="statKolon">0</div><div class="stat-lbl">KOLON</div></div>
    <div class="stat-card"><div class="stat-val purple" id="statDeger">0</div><div class="stat-lbl">💎</div></div>
  </div>
  <div id="matchesList"></div>

  <div class="kupon-cubugu" id="kuponCubugu">
    <div class="kc-info">
      <div class="kc-satir"><span>Maç</span><b id="kcMac">0</b></div>
      <div class="kc-satir"><span>Kolon</span><b id="kcKolon">0</b></div>
      <div class="kc-satir"><span>Tutar</span><b id="kcTutar">0 TL</b></div>
      <div class="kc-satir"><span>Kalan</span><b id="kcKalan">100 TL</b></div>
    </div>
    <div class="kc-butonlar">
      <button class="btn btn-red btn-sm" onclick="tumSecimleriSil()">🗑️</button>
      <button class="btn btn-green" onclick="kuponuKaydet('toto')">💾 KAYDET</button>
    </div>
  </div>
</section>

<!-- SAYFA 2: SERBEST -->
<section id="page-2" class="page">
  <div class="page-actions">
    <button class="btn btn-green" onclick="openSerbestModal()">➕ Maç Ekle</button>
    <button class="btn btn-red" onclick="temizleSerbest()">🗑️ Temizle</button>
  </div>
  <div id="serbestListesi"></div>
  <div class="kupon-cubugu" id="kuponCubuguSerbest" style="display:none">
    <div class="kc-info">
      <div class="kc-satir"><span>Maç</span><b id="kcMacS">0</b></div>
      <div class="kc-satir"><span>Kolon</span><b id="kcKolonS">0</b></div>
      <div class="kc-satir"><span>Tutar</span><b id="kcTutarS">0 TL</b></div>
    </div>
    <div class="kc-butonlar">
      <button class="btn btn-red btn-sm" onclick="serbestSecimleriSil()">🗑️</button>
      <button class="btn btn-green" onclick="kuponuKaydet('iddaa')">💾 KAYDET</button>
    </div>
  </div>
</section>

<!-- SAYFA 3: KUPONLARIM -->
<section id="page-3" class="page">
  <div class="card">
    <div class="result-title">💾 KAYITLI KUPONLARIM</div>
    <div id="kayitliKuponlar"></div>
  </div>
</section>

<!-- SAYFA 4: KARŞILAŞTIR -->
<section id="page-4" class="page">
  <div class="card">
    <div class="result-title">🆚 SİSTEM vs SEN</div>
    <div class="muted" style="font-size:.72rem;margin-bottom:12px">
      Kaydettiğin kuponların sonuçlarına göre karşılaştırma
    </div>
    <div id="karsilastirmaListesi"></div>
  </div>
</section>

</main>

<!-- MODAL: OTOMATİK KUPON SEÇİMİ -->
<div class="modal" id="secimModal">
  <div class="modal-content">
    <div class="modal-head"><span>⚡ OTOMATİK KUPON</span><button onclick="closeModal('secimModal')">✖</button></div>
    <div class="modal-body" id="secimModalBody"></div>
  </div>
</div>

<!-- MODAL: SERBEST MAÇ EKLE -->
<div class="modal" id="serbestModal">
  <div class="modal-content">
    <div class="modal-head"><span>➕ SERBEST MAÇ EKLE</span><button onclick="closeModal('serbestModal')">✖</button></div>
    <div class="modal-body">
      <label>Maç Adı</label>
      <input type="text" id="sm-match" placeholder="Örn: Galatasaray - Fenerbahçe">
      <div class="oran-grid-3">
        <div><label>1</label><input type="number" step="0.01" id="sm-o1"></div>
        <div><label>X</label><input type="number" step="0.01" id="sm-oX"></div>
        <div><label>2</label><input type="number" step="0.01" id="sm-o2"></div>
      </div>
      <button class="btn btn-green btn-lg" onclick="serbestEkle()" style="margin-top:12px">✅ EKLE</button>
    </div>
  </div>
</div>

<!-- MODAL: MAÇ DETAY -->
<div class="modal" id="macDetayModal">
  <div class="modal-content">
    <div class="modal-head"><span id="macDetayTitle">Maç Detay</span><button onclick="closeModal('macDetayModal')">✖</button></div>
    <div class="modal-body" id="macDetayBody"></div>
  </div>
</div>

<!-- MODAL: KUPON DETAY -->
<div class="modal" id="kuponDetayModal">
  <div class="modal-content">
    <div class="modal-head"><span>💾 KUPON DETAY</span><button onclick="closeModal('kuponDetayModal')">✖</button></div>
    <div class="modal-body" id="kuponDetayBody"></div>
  </div>
</div>

<!-- MODAL: TOAST -->
<div class="modal" id="toastModal">
  <div class="modal-content small">
    <div class="modal-body center">
      <div id="toastIcon" style="font-size:2.5rem">✅</div>
      <div id="toastTitle" style="font-weight:900;margin:8px 0"></div>
      <div id="toastMsg" class="muted"></div>
      <button class="btn btn-blue" onclick="closeModal('toastModal')" style="margin-top:12px">TAMAM</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
