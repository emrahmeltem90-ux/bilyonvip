<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKORTAHMİN | Canlı Analiz ve Poisson Matrisleri</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070d0b;
            --bg-card: #0e1814;
            --border-card: rgba(34, 197, 94, 0.15);
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --text-primary: #ecfdf5;
            --text-secondary: #6ee7b7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding-bottom: 90px; }

        .top-navbar {
            background: rgba(7, 13, 11, 0.95);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-weight: 900; font-size: 18px; color: #fff; }
        .brand span { background: var(--accent-green); color: #03110a; padding: 2px 6px; border-radius: 4px; }

        .hero-banner { padding: 20px; background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, transparent 100%); border-bottom: 1px solid var(--border-card); }
        .hero-title { font-size: 20px; font-weight: 900; }
        .hero-subtitle { font-size: 11px; color: #94a3b8; margin-top: 4px; }

        .section-title { font-size: 12px; font-weight: 800; color: #94a3b8; padding: 15px 20px 8px 20px; text-transform: uppercase; }
        .feed { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.15s;
        }
        .match-card:hover { border-color: var(--accent-green); }
        .match-header { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 10px; color: #fff; }
        .match-score-time { background: #040807; border: 1px solid var(--border-card); padding: 3px 8px; border-radius: 6px; font-size: 11px; color: var(--accent-green); font-weight: 800; }

        .ai-bar {
            background: rgba(16, 185, 129, 0.05);
            border: 1px dashed rgba(16, 185, 129, 0.2);
            border-radius: 6px;
            padding: 7px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .ai-val { color: var(--accent-green); font-weight: 800; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: flex-end; z-index: 500;
        }
        .modal-content {
            background: var(--bg-card);
            border-top: 2px solid var(--accent-green);
            width: 100%; max-height: 85vh;
            border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto;
        }
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .matrix-box { background: #040807; border: 1px solid var(--border-card); padding: 10px; text-align: center; border-radius: 8px; }
        .matrix-score { font-size: 15px; font-weight: 900; color: #fff; }
        .matrix-prob { font-size: 10px; color: var(--accent-green); font-weight: 700; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="brand">SKOR <span>TAHMİN</span></div>
        <div style="font-size: 14px; color: var(--text-secondary);">⚙️ 👤</div>
    </div>

    <div class="hero-banner">
        <div class="hero-title">Canlı Maç Bülteni</div>
        <div class="hero-subtitle">Anlık Skorlar ve Poisson Matrisleri</div>
    </div>

    <div class="section-title">Günün Programı</div>
    <div class="feed" id="matchFeed">
        <div style="text-align:center; color:#94a3b8; padding:20px;">Bülten yükleniyor...</div>
    </div>

    <div id="matchModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:11px; color:#94a3b8; font-weight:700;" id="modalLeague">LİG</span>
                <span style="cursor:pointer; color:#fff; font-weight:800; font-size:12px;" onclick="closeModalForce()">✕ Kapat</span>
            </div>
            <h2 style="font-size:16px; margin-bottom:12px; text-align:center; color:#fff;" id="modalTeams">Takım vs Takım</h2>
            <div class="ai-bar" style="margin-bottom:12px;">
                <span style="color:#6ee7b7; font-weight:700;">📊 Poisson Model Analizi</span>
                <span class="ai-val" id="modalConfidence">Analiz Tamamlandı</span>
            </div>
            <div style="font-size:11px; font-weight:800; color:#94a3b8; margin-bottom:6px;">EN OLASI 3 SKOR MATRİSİ</div>
            <div class="matrix-grid" id="modalMatrix"></div>
        </div>
    </div>

    <script>
        let globalMatches = [];

        async function loadMatches() {
            try {
                const response = await fetch('matches.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Veri çekilemedi');
                const data = await response.json();
                globalMatches = data.matches || [];
                renderFeed(globalMatches);
            } catch (err) {
                console.error(err);
                document.getElementById('matchFeed').innerHTML = "<div style='text-align:center; color:#ef4444; padding:20px;'>Bülten yüklenirken hata oluştu.</div>";
            }
        }

        function renderFeed(matches) {
            const feed = document.getElementById('matchFeed');
            if.length === 0 {
                feed.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>Aktif maç bulunamadı.</div>";
                return;
            }

            feed.innerHTML = "";
            matches.forEach((m, index) => {
                const league = m.league || "Lig";
                const home = m.home_team || m.home || "Ev Sahibi";
                const away = m.away_team || m.away || "Deplasman";
                const score = m.score || "VS";
                const time = m.minute || m.time || "MS";
                
                let aiText = "";
                if (m.poisson) {
                    aiText = `Poisson: %${m.poisson.rate || '65'} ${m.poisson.prediction || 'MS 1'} (Güven: %${m.poisson.confidence || '80'})`;
                } else {
                    aiText = m.ai || "Poisson analizi hazır";
                }

                feed.innerHTML += `
                    <div class="match-card" onclick="openModal(${index})">
                        <div class="match-header">
                            <span>${league}</span>
                            <span>${time} 🔍 Matris</span>
                        </div>
                        <div class="match-teams">
                            <span>${home}</span>
                            <span class="match-score-time">${score}</span>
                            <span style="text-align:right;">${away}</span>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const m = globalMatches[index];
            if (!m) return;

            document.getElementById('modalLeague').innerText = m.league || "Lig";
            document.getElementById('modalTeams').innerText = `${m.home_team || m.home} vs ${m.away_team || m.away}`;
            
            const matrix = m.matrix || ["1-0", "2-0", "1-1"];
            let matrixHtml = '';
            matrix.forEach((scoreVal, idx) => {
                let prob = idx === 0 ? "%12 (En Yüksek)" : (idx === 1 ? "%9" : "%7");
                matrixHtml += `
                    <div class="matrix-box">
                        <div class="matrix-score">${scoreVal}</div>
                        <div class="matrix-prob">${prob}</div>
                    </div>
                `;
            });
            document.getElementById('modalMatrix').innerHTML = matrixHtml;
            document.getElementById('matchModal').style.display = 'flex';
        }

        function closeModal(e) {
            if(e.target.id === 'matchModal') document.getElementById('matchModal').style.display = 'none';
        }
        function closeModalForce() {
            document.getElementById('matchModal').style.display = 'none';
        }

        loadMatches();
    </script>
</body>
</html>
