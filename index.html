<script>
    let globalMatches = [];

    async function loadMatches() {
        const feed = document.getElementById('matchFeed');
        feed.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>Günlük müsabakalar taranıyor...</div>";

        try {
            // CORS engelini aşmak için ücretsiz proxy köprüsü kullanıyoruz
            // Örnek olarak açık spor veri kaynaklarını veya kendi JSON'unu buraya bağlayabilirsin
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            
            // Eğer kendi matches.json dosyanı okutmak istiyorsan direkt dosya adını yazabilirsin:
            const targetUrl = 'https://emrahmeltem90-ux.github.io/bilyonvip/matches.json'; // veya canlı bir API adresi
            
            const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
            if (!response.ok) throw new Error('Veri alınamadı');
            
            const data = await response.json();
            globalMatches = data.matches || [];
            renderFeed(globalMatches);

        } catch (err) {
            console.warn("Canlı veri çekilirken hata oluştu, yedek bülten yükleniyor:", err);
            // Bağlantı koparsa veya dış kaynak yanıt vermezse acil durum yedek listesi
            globalMatches = [
                {
                    league: "Arjantin • Liga Profesional",
                    home_team: "River Plate",
                    away_team: "Boca Juniors",
                    time: "23:30",
                    score: "VS",
                    poisson: { rate: "49", prediction: "MS X", confidence: "77" },
                    matrix: ["1-1", "0-0", "1-0"]
                },
                {
                    league: "Brezilya • Serie A",
                    home_team: "Flamengo",
                    away_team: "Palmeiras",
                    time: "01:00",
                    score: "VS",
                    poisson: { rate: "55", prediction: "MS 2", confidence: "83" },
                    matrix: ["0-1", "1-2", "1-1"]
                },
                {
                    league: "ABD • MLS",
                    home_team: "Inter Miami",
                    away_team: "LA Galaxy",
                    time: "03:30",
                    score: "VS",
                    poisson: { rate: "72", prediction: "MS 1", confidence: "90" },
                    matrix: ["2-0", "3-1", "2-1"]
                }
            ];
            renderFeed(globalMatches);
        }
    }

    function renderFeed(matches) {
        const feed = document.getElementById('matchFeed');
        if (!matches || matches.length === 0) {
            feed.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>Aktif müsabaka bulunamadı.</div>";
            return;
        }

        feed.innerHTML = "";
        matches.forEach((m, index) => {
            const league = m.league || "Lig";
            const home = m.home_team || m.home || "Ev Sahibi";
            const away = m.away_team || m.away || "Deplasman";
            const score = m.score || "VS";
            const time = m.minute || m.time || "MS";
            
            let aiText = "";
            if (m.poisson) {
                aiText = `Poisson: %${m.poisson.rate} ${m.poisson.prediction} (Güven: %${m.poisson.confidence})`;
            } else {
                aiText = m.ai || "Poisson analizi hazır";
            }

            feed.innerHTML += `
                <div class="match-card" onclick="openModal(${index})">
                    <div class="match-header">
                        <span>${league}</span>
                        <span>${time} 🔍 Matris</span>
                    </div>
                    <div class="match-teams">
                        <span>${home}</span>
                        <span class="match-score-time">${score}</span>
                        <span style="text-align:right;">${away}</span>
                    </div>
                    <div class="ai-bar">
                        <span style="color:#6ee7b7; font-weight:700;">⚡ ${aiText}</span>
                        <span class="ai-val">İncele ></span>
                    </div>
                </div>
            `;
        });
    }

    function openModal(index) {
        const m = globalMatches[index];
        if (!m) return;

        document.getElementById('modalLeague').innerText = m.league || "Lig";
        document.getElementById('modalTeams').innerText = `${m.home_team || m.home} vs ${m.away_team || m.away}`;
        
        const matrix = m.matrix || ["1-0", "2-0", "1-1"];
        let matrixHtml = '';
        matrix.forEach((scoreVal, idx) => {
            let prob = idx === 0 ? "%12 (En Yüksek)" : (idx === 1 ? "%9" : "%7");
            matrixHtml += `
                <div class="matrix-box">
                    <div class="matrix-score">${scoreVal}</div>
                    <div class="matrix-prob">${prob}</div>
                </div>
            `;
        });
        document.getElementById('modalMatrix').innerHTML = matrixHtml;
        document.getElementById('matchModal').style.display = 'flex';
    }

    function closeModal(e) {
        if(e.target.id === 'matchModal') document.getElementById('matchModal').style.display = 'none';
    }
    function closeModalForce() {
        document.getElementById('matchModal').style.display = 'none';
    }

    loadMatches();
</script>
