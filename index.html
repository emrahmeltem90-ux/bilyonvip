<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>SkorLab</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">⚽ SKORLAB</div>
  <div id="weekTitle" class="week">Yükleniyor...</div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="switchTab(1,this)">📋 Bülten</button>
  <button class="tab" onclick="switchTab(2,this)">💾 Kuponlarım</button>
</nav>

<main>

<section id="page-1" class="page active">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="statMac">0</div><div class="stat-lbl">MAÇ</div></div>
    <div class="stat-card"><div class="stat-val blue" id="statSecilen">0</div><div class="stat-lbl">SEÇİLEN</div></div>
    <div class="stat-card"><div class="stat-val green" id="statKolon">0</div><div class="stat-lbl">KOLON</div></div>
    <div class="stat-card"><div class="stat-val orange" id="statTutar">0</div><div class="stat-lbl">TL</div></div>
  </div>
  <div id="matchesList"></div>
</section>

<section id="page-2" class="page">
  <div class="card">
    <div class="result-title">💾 KAYITLI KUPONLARIM</div>
    <div id="kayitliKuponlar"></div>
  </div>
</section>

</main>

<div class="kupon-cubugu" id="kuponCubugu">
  <div class="kc-info">
    <div class="kc-satir"><span>Maç</span><b id="kcMac">0</b></div>
    <div class="kc-satir"><span>Kolon</span><b id="kcKolon">0</b></div>
    <div class="kc-satir"><span>Tutar</span><b id="kcTutar">0 TL</b></div>
  </div>
  <div class="kc-butonlar">
    <button class="btn btn-red btn-sm" onclick="tumSecimleriSil()">🗑️</button>
    <button class="btn btn-green" onclick="kuponuKaydet()">💾 KAYDET</button>
  </div>
</div>

<div class="modal" id="analizModal">
  <div class="modal-content">
    <div class="modal-head"><span id="analizTitle">Analiz</span><button onclick="closeModal('analizModal')">✖</button></div>
    <div class="modal-body" id="analizBody"></div>
  </div>
</div>

<div class="modal" id="kuponDetayModal">
  <div class="modal-content">
    <div class="modal-head"><span>💾 KUPON DETAY</span><button onclick="closeModal('kuponDetayModal')">✖</button></div>
    <div class="modal-body" id="kuponDetayBody"></div>
  </div>
</div>

<div class="modal" id="toastModal">
  <div class="modal-content small">
    <div class="modal-body center">
      <div id="toastIcon" style="font-size:2.5rem">✅</div>
      <div id="toastTitle" style="font-weight:900;margin:8px 0"></div>
      <div id="toastMsg" class="muted"></div>
      <button class="btn btn-blue" onclick="closeModal('toastModal')" style="margin-top:12px">TAMAM</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
