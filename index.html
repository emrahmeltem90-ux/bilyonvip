<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedef 15 - Spor Toto Otomasyonu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 18px;
            background: var(--card-bg);
            border-radius: 12px;
            border-bottom: 4px solid var(--accent-green);
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 110px;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .control-group input, .control-group select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .total-cost-badge {
            background: var(--bg-color);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        @media(min-width: 500px) {
            .match-card {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .match-date {
            font-size: 0.7rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        .match-teams {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .match-options {
            display: flex;
            gap: 6px;
        }

        .btn-opt {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .btn-opt.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-main {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn-sec {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        #results {
            margin-top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: none;
            border: 1px solid var(--border-color);
        }

        #results h3 {
            color: var(--accent-green);
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .summary-info {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-green);
            line-height: 1.5;
        }

        .coupon-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .coupon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .coupon-title {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-copy-mini {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .coupon-matches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            text-align: center;
        }

        .match-badge {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .match-badge span {
            display: block;
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .match-badge strong {
            color: var(--accent-green);
            font-size: 0.85rem;
        }

        .analysis-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-card h4 {
            color: var(--text-main);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HEDEF 15 PRO</h1>
            <p>Spor Toto Matris & Kolon Optimizasyon Sistemi</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bulten', this)">Bülten & Kolon</button>
            <button class="tab-btn" onclick="switchTab('analiz', this)">Maç Durumları</button>
            <button class="tab-btn" onclick="switchTab('kayitli', this)">💾 Kuponlarım</button>
        </div>

        <!-- 1. BÜLTEN SEKMESİ -->
        <div id="tab-bulten" class="tab-content active">
            <div class="control-panel">
                <div class="control-group">
                    <label for="riskMode">Sistem Dağılım Modu:</label>
                    <select id="riskMode">
                        <option value="balanced">Dengeli / Akıllı Dağılım</option>
                        <option value="garanti">Garanti Odaklı (Favori Ağırlıklı)</option>
                        <option value="jackpot">Sürpriz / Matris Modu</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="budgetInput">Bütçe Gir (TL):</label>
                    <input type="number" id="budgetInput" value="200" oninput="calculateColumnsFromBudget()">
                </div>
                <div class="control-group">
                    <label for="columnCountInput">Kaç Kolon Olsun?</label>
                    <input type="number" id="columnCountInput" value="20" oninput="calculateBudgetFromColumns()">
                </div>
            </div>

            <div class="total-cost-badge" id="totalCostDisplay">Toplam Tutar: 200 TL (20 Kolon - Kolon Başı: 10 TL)</div>

            <div id="matches-container"></div>

            <div class="actions">
                <button class="btn-main" onclick="generateColumns()">Kolonları Otomatik Dağıt & Üret</button>
                <button class="btn-sec" onclick="saveCurrentCoupons()">💾 Kaydet</button>
            </div>

            <div id="results">
                <h3>Oluşturulan Kuponlar</h3>
                <div class="summary-info" id="summaryText"></div>
                <div id="columnOutputContainer"></div>
            </div>
        </div>

        <!-- 2. ANALİZ SEKMESİ -->
        <div id="tab-analiz" class="tab-content">
            <div id="analysis-container"></div>
        </div>

        <!-- 3. KAYITLI KUPONLAR SEKMESİ -->
        <div id="tab-kayitli" class="tab-content">
            <div id="savedCouponsContainer"></div>
        </div>
    </div>

    <script>
        const bulten = [
            { id: 1, date: "02 Eki", home: "Belçika", away: "Türkiye" },
            { id: 2, date: "05 Eki", home: "İtalya", away: "Türkiye" },
            { id: 3, date: "02 Eki", home: "Bosna", away: "İsveç" },
            { id: 4, date: "02 Eki", home: "Fransa", away: "İtalya" },
            { id: 5, date: "02 Eki", home: "Macaristan", away: "Gürcistan" },
            { id: 6, date: "02 Eki", home: "Polonya", away: "Romanya" },
            { id: 7, date: "03 Eki", home: "Hırvatistan", away: "İngiltere" },
            { id: 8, date: "03 Eki", home: "K.Makedonya", away: "İskoçya" },
            { id: 9, date: "03 Eki", home: "İspanya", away: "Çekya" },
            { id: 10, date: "03 Eki", home: "İsviçre", away: "Slovenya" },
            { id: 11, date: "04 Eki", home: "Galler", away: "Danimarka" },
            { id: 12, date: "04 Eki", home: "Hollanda", away: "Sırbistan" },
            { id: 13, date: "04 Eki", home: "Portekiz", away: "Norveç" },
            { id: 14, date: "04 Eki", home: "Yunanistan", away: "Almanya" },
            { id: 15, date: "04 Eki", home: "Fransa", away: "Belçika" }
        ];

        const userSelections = {};
        let lastGeneratedCoupons = [];
        let isUpdating = false;

        function renderMatches() {
            const container = document.getElementById('matches-container');
            if(!container) return;
            container.innerHTML = '';

            bulten.forEach(m => {
                if (!userSelections[m.id]) {
                    userSelections[m.id] = ['1', '0', '2'];
                }

                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-info">
                        <span class="match-date">${m.date}</span>
                        <span class="match-teams">${m.home} - ${m.away}</span>
                    </div>
                    <div class="match-options">
                        <button class="btn-opt ${userSelections[m.id].includes('1') ? 'active' : ''}" onclick="toggleOption(${m.id}, '1', this)">1</button>
                        <button class="btn-opt ${userSelections[m.id].includes('0') ? 'active' : ''}" onclick="toggleOption(${m.id}, '0', this)">0</button>
                        <button class="btn-opt ${userSelections[m.id].includes('2') ? 'active' : ''}" onclick="toggleOption(${m.id}, '2', this)">2</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function calculateColumnsFromBudget() {
            if (isUpdating) return;
            isUpdating = true;

            const budgetInput = document.getElementById('budgetInput');
            const columnInput = document.getElementById('columnCountInput');
            const display = document.getElementById('totalCostDisplay');

            let budget = parseFloat(budgetInput.value) || 0;
            let columns = Math.max(1, Math.floor(budget / 10));
            
            columnInput.value = columns;
            display.innerText = `Toplam Tutar: ${budget} TL (${columns} Kolon - Kolon Başı: 10 TL)`;

            isUpdating = false;
        }

        function calculateBudgetFromColumns() {
            if (isUpdating) return;
            isUpdating = true;

            const budgetInput = document.getElementById('budgetInput');
            const columnInput = document.getElementById('columnCountInput');
            const display = document.getElementById('totalCostDisplay');

            let columns = parseInt(columnInput.value) || 1;
            let budget = columns * 10;

            budgetInput.value = budget;
            display.innerText = `Toplam Tutar: ${budget} TL (${columns} Kolon - Kolon Başı: 10 TL)`;

            isUpdating = false;
        }

        function renderAnalysis() {
            const container = document.getElementById('analysis-container');
            if(!container) return;
            container.innerHTML = '';
            bulten.forEach(m => {
                const card = document.createElement('div');
                card.className = 'analysis-card';
                card.innerHTML = `<h4>${m.date} | ${m.home} - ${m.away}</h4><span style="font-size:0.75rem; color:var(--accent-green);">Aktif Matris Takipte</span>`;
                container.appendChild(card);
            });
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (tabName === 'bulten') document.getElementById('tab-bulten').classList.add('active');
            else if (tabName === 'analiz') document.getElementById('tab-analiz').classList.add('active');
            else if (tabName === 'kayitli') {
                document.getElementById('tab-kayitli').classList.add('active');
                loadSavedCouponsView();
            }
        }

        function toggleOption(matchId, option, btnElement) {
            let list = userSelections[matchId];
            if (list.includes(option)) {
                if (list.length > 1) {
                    userSelections[matchId] = list.filter(item => item !== option);
                    btnElement.classList.remove('active');
                }
            } else {
                list.push(option);
                btnElement.classList.add('active');
            }
        }

        function generateColumns() {
            const targetColumnCount = parseInt(document.getElementById('columnCountInput').value) || 1;
            const totalBudget = parseFloat(document.getElementById('budgetInput').value) || (targetColumnCount * 10);
            const resultsDiv = document.getElementById('results');
            const summaryDiv = document.getElementById('summaryText');
            const outputContainer = document.getElementById('columnOutputContainer');
            const riskMode = document.getElementById('riskMode').value;
            
            resultsDiv.style.display = 'block';
            summaryDiv.innerHTML = "Kolonlar hesaplanıyor...";
            outputContainer.innerHTML = "";

            setTimeout(() => {
                summaryDiv.innerHTML = `Toplam Bütçe: <b>${totalBudget} TL</b> | Kolon Adedi: <b>${targetColumnCount} Kolon</b> | Mod: <b>${riskMode.toUpperCase()}</b>`;
                
                let htmlContent = "";
                lastGeneratedCoupons = [];

                for(let i = 1; i <= targetColumnCount; i++) {
                    let matchesHtml = "";
                    let couponArray = [];

                    bulten.forEach((m, index) => {
                        let availableOpts = userSelections[m.id] && userSelections[m.id].length > 0 
                            ? [...userSelections[m.id]] 
                            : ['1', '0', '2'];
                        
                        let chosenOpt;
                        if (riskMode === 'garanti') {
                            chosenOpt = Math.random() < 0.6 ? availableOpts[0] : availableOpts[Math.floor(Math.random() * availableOpts.length)];
                        } else if (riskMode === 'jackpot') {
                            chosenOpt = availableOpts[availableOpts.length - 1];
                        } else {
                            chosenOpt = availableOpts[Math.floor(Math.random() * availableOpts.length)];
                        }

                        couponArray.push({ match: `M${index+1}`, pick: chosenOpt });

                        matchesHtml += `
                            <div class="match-badge">
                                <span>M${index+1}</span>
                                <strong>[${chosenOpt}]</strong>
                            </div>
                        `;
                    });

                    lastGeneratedCoupons.push({ id: i, matches: couponArray });

                    htmlContent += `
                        <div class="coupon-card">
                            <div class="coupon-header">
                                <div class="coupon-title">Kolon #${i < 10 ? '0'+i : i}</div>
                                <button class="btn-copy-mini" onclick="copySingleCoupon(${i})">Kopyala</button>
                            </div>
                            <div class="coupon-matches">${matchesHtml}</div>
                        </div>
                    `;
                }
                outputContainer.innerHTML = htmlContent;
            }, 200);
        }

        function copySingleCoupon(index) {
            const coupon = lastGeneratedCoupons.find(c => c.id === index);
            if (!coupon) return;
            const text = `Kolon #${index}: ` + coupon.matches.map(m => `${m.match}[${m.pick}]`).join(' ');
            navigator.clipboard.writeText(text).then(() => {
                alert(`Kolon #${index} panoya kopyalandı!`);
            });
        }

        function saveCurrentCoupons() {
            if (lastGeneratedCoupons.length === 0) {
                alert("Önce kolon üretmelisiniz!");
                return;
            }
            let saved = JSON.parse(localStorage.getItem('saved_toto_coupons') || '[]');
            saved.push({ date: new Date().toLocaleString(), coupons: lastGeneratedCoupons });
            localStorage.setItem('saved_toto_coupons', JSON.stringify(saved));
            alert("Kuponlar başarıyla kaydedildi!");
        }

        function loadSavedCouponsView() {
            const container = document.getElementById('savedCouponsContainer');
            if(!container) return;
            let saved = JSON.parse(localStorage.getItem('saved_toto_coupons') || '[]');
            if (saved.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Henüz kayıtlı kupon bulunmuyor.</p>';
                return;
            }
            container.innerHTML = '';
            saved.forEach((group, gIdx) => {
                let groupHtml = `<div class="coupon-card"><div class="coupon-title">Kayıt Grubu #${gIdx+1} (${group.date})</div>`;
                group.coupons.forEach(c => {
                    let mStr = c.matches.map(m => `${m.match}:[${m.pick}]`).join(', ');
                    groupHtml += `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Kolon #${c.id} -> ${mStr}</div>`;
                });
                groupHtml += `</div>`;
                container.innerHTML += groupHtml;
            });
        }

        window.onload = function() {
            renderMatches();
            renderAnalysis();
        };
    </script>
</body>
</html>
