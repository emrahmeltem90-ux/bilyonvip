<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BilyonVIP - Canlı & Gelecek & Biten Maçlar Bülteni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding-bottom: 85px; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #102e1b 0%, #161b22 100%); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; }
        .header-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .header-icons i { font-size: 18px; margin-left: 15px; color: #8b949e; }
        
        .hero { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background-color: #161b22; border-bottom: 1px solid #21262d; }
        .logo-text { font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
        .date-badge { background-color: #0e3a24; color: #3fb950; border: 1px solid #238636; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

        /* Arama ve Durum Filtreleri */
        .controls-panel { background-color: #161b22; padding: 10px 12px; border-bottom: 1px solid #21262d; display: flex; flex-direction: column; gap: 8px; }
        .search-input { width: 100%; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none; }
        
        .status-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .status-btn { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; border-radius: 16px; padding: 5px 12px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .status-btn.active { background-color: #238636; color: #ffffff; border-color: #2ea043; }

        /* Tablar */
        .nav-tabs { display: flex; background-color: #161b22; border-bottom: 2px solid #21262d; }
        .tab-btn { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 700; color: #8b949e; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #3fb950; border-bottom-color: #3fb950; }
        
        /* Container ve Kartlar */
        .container { padding: 10px; max-width: 600px; margin: 0 auto; }
        .match-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px; position: relative; }
        
        .card-top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 8px; border-bottom: 1px dashed #21262d; padding-bottom: 6px; }
        .league-name { color: #8b949e; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 65%; }
        
        .status-tag { padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 10px; }
        .status-tag.live { background-color: #da3633; color: #fff; animation: pulse 1.5s infinite; }
        .status-tag.pre { background-color: #1f6beb; color: #fff; }
        .status-tag.post { background-color: #30363d; color: #8b949e; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .match-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .team-box { width: 38%; font-size: 14px; font-weight: 800; color: #f0f6fc; }
        .team-box.home { text-align: left; }
        .team-box.away { text-align: right; }
        .score-box { background-color: #0d1117; padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; font-size: 16px; font-weight: 900; color: #3fb950; text-align: center; min-width: 70px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .stat-box { background-color: #0d1117; border-radius: 6px; padding: 6px 8px; }
        .stat-label { font-size: 10px; color: #8b949e; }
        .stat-val { font-size: 12px; font-weight: 700; color: #3fb950; }
        .prediction-banner { background-color: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; font-weight: 800; color: #3fb950; }
        
        .telegram-btn { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background-color: #0088cc; color: #ffffff; text-decoration: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 12px; box-shadow: 0 4px 15px rgba(0,136,204,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 999; }
        
        .skeleton { background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 8px; height: 100px; margin-bottom: 10px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">BilyonVIP +</div>
        <div class="header-icons"><i class="fas fa-share-alt"></i><i class="fas fa-bell"></i></div>
    </div>

    <div class="hero">
        <div class="logo-text">BİLYONVIP</div>
        <div class="date-badge" id="matchCounter">Gözlemleniyor...</div>
    </div>

    <!-- Arama ve Maç Durumu Filtre Paneli -->
    <div class="controls-panel">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Takım veya Lig ara..." onkeyup="applyFilters()">
        <div class="status-filters">
            <button class="status-btn active" onclick="setStatusFilter('ALL', this)">Tümü</button>
            <button class="status-btn" onclick="setStatusFilter('LIVE', this)">🔴 Canlı</button>
            <button class="status-btn" onclick="setStatusFilter('PRE', this)">⏰ Oynanacak</button>
            <button class="status-btn" onclick="setStatusFilter('POST', this)">🏁 Bitenler</button>
        </div>
    </div>

    <!-- Analiz Tabları -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('bulten', this)">⚽ BÜLTEN & TAHMİN</button>
        <button class="tab-btn" onclick="switchTab('monte', this)">🎲 MONTE CARLO</button>
        <button class="tab-btn" onclick="switchTab('toto', this)">📊 SPOR TOTO 15</button>
    </div>

    <div class="container" id="mainContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <a href="https://t.me/bilyonvip" target="_blank" class="telegram-btn">
        <i class="fab fa-telegram-plane"></i> CANLI VIP TAHMİNLER İÇİN TELEGRAM'A KATIL
    </a>

    <script>
        let globalMatches = [];
        let activeStatusFilter = 'ALL';
        let currentTab = 'bulten';

        function poissonSample(lambda) {
            let L = Math.exp(-lambda), k = 0, p = 1.0;
            do { k++; p *= Math.random(); } while (p > L);
            return k - 1;
        }

        function runMonteCarloJS(home, away, hXg, aXg, extraData) {
            let scoreCounts = {}, over25 = 0, winH = 0, draw = 0, winA = 0;
            for (let i = 0; i < 5000; i++) {
                let hG = poissonSample(hXg), aG = poissonSample(aXg);
                let scoreKey = `${hG} - ${aG}`;
                scoreCounts[scoreKey] = (scoreCounts[scoreKey] || 0) + 1;
                if ((hG + aG) > 2.5) over25++;
                if (hG > aG) winH++; else if (hG === aG) draw++; else winA++;
            }
            let sorted = Object.entries(scoreCounts).sort((a,b) => b[1] - a[1]);
            let pOver = ((over25 / 5000) * 100).toFixed(1);
            let pH = ((winH / 5000) * 100).toFixed(1);
            let pD = ((draw / 5000) * 100).toFixed(1);
            let pA = ((winA / 5000) * 100).toFixed(1);

            return {
                home: home, 
                away: away,
                league: extraData.league || "Futbol Ligi",
                state: extraData.state || "pre", // 'in', 'pre', 'post'
                statusText: extraData.statusText || "VS",
                scoreText: extraData.scoreText || "VS",
                p_over25: pOver, p_under25: (100 - pOver).toFixed(1),
                p_home: pH, p_draw: pD, p_away: pA,
                exact_score: sorted[0] ? sorted[0][0] : "1 - 0",
                backup_score: sorted[1] ? sorted[1][0] : "1 - 1",
                prediction_25: parseFloat(pOver) >= 52.0 ? "2.5 ÜST" : "2.5 ALT",
                prediction_1x2: parseFloat(pH) >= Math.max(parseFloat(pD), parseFloat(pA)) ? "1" : (parseFloat(pD) >= parseFloat(pA) ? "X" : "2")
            };
        }

        // Yedek / Sabit Biten ve Oynanacak Maç Listesi
        const fallbackList = [
            { home: "Galatasaray", away: "Fenerbahçe", hXg: 2.1, aXg: 1.8, league: "Süper Lig", state: "pre", statusText: "20:00", scoreText: "VS" },
            { home: "Beşiktaş", away: "Trabzonspor", hXg: 1.7, aXg: 1.4, league: "Süper Lig", state: "in", statusText: "🔴 64'", scoreText: "2 - 1" },
            { home: "Real Madrid", away: "Barcelona", hXg: 2.3, aXg: 2.0, league: "La Liga", state: "post", statusText: "🏁 BİTTİ", scoreText: "3 - 2" },
            { home: "Liverpool", away: "Chelsea", hXg: 2.2, aXg: 1.5, league: "Premier League", state: "in", statusText: "🔴 38'", scoreText: "1 - 1" },
            { home: "Fethiyespor", away: "Erzincanspor", hXg: 1.4, aXg: 1.1, league: "TFF 2. Lig", state: "post", statusText: "🏁 BİTTİ", scoreText: "1 - 0" },
            { home: "Seydikemerspor", away: "Muğlaspor", hXg: 1.3, aXg: 1.0, league: "BAL Ligi", state: "pre", statusText: "15:30", scoreText: "VS" }
        ];

        async function fetchLiveBulten() {
            let matches = [];
            let seen = new Set();

            try {
                let res = await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?limit=300");
                if (res.ok) {
                    let data = await res.json();
                    if (data.events && data.events.length > 0) {
                        data.events.forEach(evt => {
                            let comp = evt.competitions && evt.competitions[0];
                            if (comp && comp.competitors && comp.competitors.length >= 2) {
                                let hTeam = comp.competitors.find(c => c.homeAway === 'home');
                                let aTeam = comp.competitors.find(c => c.homeAway === 'away');
                                if (hTeam && aTeam) {
                                    let hName = hTeam.team.displayName || hTeam.team.name;
                                    let aName = aTeam.team.displayName || aTeam.team.name;
                                    let key = `${hName}_${aName}`;

                                    if (!seen.has(key)) {
                                        seen.add(key);
                                        let rawState = evt.status?.type?.state || "pre";
                                        let state = (rawState === "in") ? "in" : (rawState === "post") ? "post" : "pre";
                                        
                                        let statusText = "VS";
                                        let scoreText = "VS";

                                        if (state === "in") {
                                            let clock = evt.status?.displayClock || "";
                                            statusText = `🔴 CANLI ${clock ? clock + "'" : ''}`;
                                            scoreText = `${hTeam.score || 0} - ${aTeam.score || 0}`;
                                        } else if (state === "post") {
                                            statusText = "🏁 BİTTİ (MS)";
                                            scoreText = `${hTeam.score || 0} - ${aTeam.score || 0}`;
                                        } else {
                                            let dateObj = new Date(evt.date);
                                            statusText = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                                            scoreText = "VS";
                                        }

                                        let hash = (hName + aName).split('').reduce((a, b) => a + b.charCodeAt(0), 0);
                                        let hXg = Number((1.1 + (hash % 14) / 10).toFixed(2));
                                        let aXg = Number((0.85 + ((hash * 3) % 11) / 10).toFixed(2));

                                        matches.push(runMonteCarloJS(hName, aName, hXg, aXg, {
                                            league: evt.season?.slug || "Futbol Ligi",
                                            state: state,
                                            statusText: statusText,
                                            scoreText: scoreText
                                        }));
                                    }
                                }
                            }
                        });
                    }
                }
            } catch (err) {
                console.log("API Yükleme hatası, yedek bülten devreye giriyor", err);
            }

            // Yedek maçları eksikleri tamamlamak için ekle
            fallbackList.forEach(fb => {
                let key = `${fb.home}_${fb.away}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    matches.push(runMonteCarloJS(fb.home, fb.away, fb.hXg, fb.aXg, fb));
                }
            });

            globalMatches = matches;
            document.getElementById("matchCounter").innerText = `• ${globalMatches.length} Maç Çekildi`;
            applyFilters();
        }

        function setStatusFilter(status, btn) {
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeStatusFilter = status;
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            
            let filtered = globalMatches.filter(m => {
                let matchesSearch = m.home.toLowerCase().includes(query) || m.away.toLowerCase().includes(query) || m.league.toLowerCase().includes(query);
                let matchesStatus = true;

                if (activeStatusFilter === 'LIVE') matchesStatus = (m.state === 'in');
                else if (activeStatusFilter === 'PRE') matchesStatus = (m.state === 'pre');
                else if (activeStatusFilter === 'POST') matchesStatus = (m.state === 'post');

                return matchesSearch && matchesStatus;
            });

            renderView(filtered);
        }

        function renderView(list) {
            const container = document.getElementById("mainContainer");
            let html = "";

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#8b949e;">Seçilen filtrede maç bulunamadı.</div>`;
                return;
            }

            if (currentTab === 'bulten') {
                list.forEach(m => {
                    let badgeClass = m.state === 'in' ? 'live' : (m.state === 'post' ? 'post' : 'pre');
                    html += `
                        <div class="match-card">
                            <div class="card-top-bar">
                                <span class="league-name">🏆 ${m.league}</span>
                                <span class="status-tag ${badgeClass}">${m.statusText}</span>
                            </div>
                            <div class="match-main">
                                <div class="team-box home">${m.home}</div>
                                <div class="score-box">${m.scoreText}</div>
                                <div class="team-box away">${m.away}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-label">2.5 ÜST İhtimali</div><div class="stat-val">%${m.p_over25}</div></div>
                                <div class="stat-box"><div class="stat-label">2.5 ALT İhtimali</div><div class="stat-val">%${m.p_under25}</div></div>
                                <div class="stat-box"><div class="stat-label">Muhtemel Skor</div><div class="stat-val">${m.exact_score}</div></div>
                                <div class="stat-box"><div class="stat-label">Yedek Skor</div><div class="stat-val">${m.backup_score}</div></div>
                            </div>
                            <div class="prediction-banner">🎯 ANALİZ TAHMİNİ: ${m.prediction_25}</div>
                        </div>`;
                });
            } else if (currentTab === 'monte') {
                list.forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="card-top-bar">
                                <span class="league-name">${m.home} - ${m.away}</span>
                                <span class="status-tag pre">5.000 İterasyon</span>
                            </div>
                            <div class="stats-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                                <div class="stat-box"><div class="stat-label">MS 1 (Ev)</div><div class="stat-val">%${m.p_home}</div></div>
                                <div class="stat-box"><div class="stat-label">MS X (Ber.)</div><div class="stat-val">%${m.p_draw}</div></div>
                                <div class="stat-box"><div class="stat-label">MS 2 (Dep)</div><div class="stat-val">%${m.p_away}</div></div>
                            </div>
                            <div class="prediction-banner">🎲 TAHMİNİ SONUÇ: MS ${m.prediction_1x2}</div>
                        </div>`;
                });
            } else if (currentTab === 'toto') {
                html = `<div class="match-card"><h4 style="margin-bottom:10px; color:#3fb950;">📊 SPOR TOTO (15 MAÇ KOLONU)</h4><table style="width:100%; font-size:12px; border-collapse:collapse;">`;
                list.slice(0, 15).forEach((m, i) => {
                    html += `<tr style="border-bottom:1px solid #21262d;"><td style="padding:6px;"><b>${i+1}.</b> ${m.home} - ${m.away}</td><td style="text-align:right; padding:6px;"><span style="background:#238636; color:#fff; padding:2px 8px; border-radius:4px; font-weight:bold;">${m.prediction_1x2}</span></td></tr>`;
                });
                html += `</table></div>`;
            }

            container.innerHTML = html;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentTab = tab;
            applyFilters();
        }

        fetchLiveBulten();
    </script>
</body>
</html>
