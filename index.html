<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hedef 15 - Akıllı Sistem</title>

<style>

:root{
    --green:#008751;
    --green2:#00a866;
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#162032;
    --text:#f8fafc;
    --muted:#94a3b8;
    --orange:#f59e0b;
    --border:#334155;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Segoe UI,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding-bottom:50px;
}

header{
    background:var(--green);
    padding:17px 12px;
    text-align:center;
}

header h2{
    font-size:1.15rem;
}

header span{
    font-size:.75rem;
    opacity:.85;
}

.tabs{
    display:flex;
    background:var(--card2);
    position:sticky;
    top:0;
    z-index:20;
}

.tab{
    flex:1;
    text-align:center;
    padding:14px 4px;
    font-size:.75rem;
    font-weight:bold;
    color:var(--muted);
    border-bottom:3px solid transparent;
}

.tab.active{
    color:var(--orange);
    border-bottom-color:var(--orange);
}

.container{
    max-width:650px;
    margin:auto;
    padding:12px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

label{
    display:block;
    color:var(--muted);
    font-size:.78rem;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:white;
    font-size:1rem;
    font-weight:bold;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:var(--green);
    color:white;
    font-size:.95rem;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.match{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:9px;
}

.match-head{
    display:flex;
    justify-content:space-between;
    color:var(--orange);
    font-size:.7rem;
    font-weight:bold;
    margin-bottom:7px;
}

.teams{
    font-weight:bold;
    font-size:.92rem;
    margin-bottom:8px;
}

.probs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.pick{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:7px;
    padding:9px 4px;
    text-align:center;
    font-weight:bold;
}

.pick.main{
    border-color:var(--green2);
}

.pick span{
    display:block;
    font-size:.68rem;
    color:#10b981;
    margin-top:2px;
}

.result{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
    margin-top:10px;
}

.result-title{
    color:var(--orange);
    font-weight:bold;
    font-size:.95rem;
    margin-bottom:8px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.stat{
    background:var(--card2);
    border-radius:7px;
    padding:9px;
}

.stat small{
    color:var(--muted);
    display:block;
}

.stat b{
    font-size:1rem;
}

.system-line{
    background:var(--card2);
    border:1px solid var(--border);
    padding:10px;
    border-radius:7px;
    margin-top:7px;
    font-size:.78rem;
    line-height:1.6;
}

.coupon{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-top:7px;
    font-size:.78rem;
    line-height:1.8;
}

.coupon b{
    color:var(--orange);
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:5px;
    background:rgba(245,158,11,.15);
    color:var(--orange);
    font-size:.68rem;
    font-weight:bold;
}

.green{
    color:#10b981;
}

.muted{
    color:var(--muted);
}

.warning{
    color:#fbbf24;
}

.danger{
    color:#f87171;
}

.progress{
    height:8px;
    background:var(--bg);
    border-radius:10px;
    overflow:hidden;
    margin-top:7px;
}

.progress div{
