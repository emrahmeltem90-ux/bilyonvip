<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resmî İddaa Bülteni</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
        .header h1 { font-size: 20px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        #status { text-align: center; font-size: 14px; margin-bottom: 15px; color: #94a3b8; }
        
        .match-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .match-meta { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        .code-badge { background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .teams { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; margin: 10px 0; color: #f1f5f9; }
        .versus { font-size: 12px; color: #64748b; font-weight: normal; margin: 0 8px; }
        
        .odds-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .odd-box { background: #0f172a; border: 1px solid #475569; border-radius: 6px; text-align: center; padding: 6px; }
        .odd-label { font-size: 11px; color: #94a3b8; display: block; }
        .odd-value { font-size: 14px; color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 RESMÎ İDDAA BÜLTENİ</h1>
    </div>

    <div id="status">Maç verileri çekiliyor...</div>
    <div id="bulten"></div>

    <script>
        // Cloudflare Worker proxy adresin:
        const PROXY = "https://dark-limit-3df4.emrah-meltem90.workers.dev/?url=";
        // Güncel İddaa/Mackolik bülten servis adresi:
        const TARGET_API = encodeURIComponent("https://bulletin.iddaa.com/api/bulletin/full");

        async function loadBulten() {
            const statusEl = document.getElementById('status');
            const bultenEl = document.getElementById('bulten');

            try {
                const response = await fetch(PROXY + TARGET_API);
                if (!response.ok) throw new Error("Ağ hatası");
                
                const data = await response.json();
                const events = data.events || data.data || [];
                
                if (events.length === 0) {
                    statusEl.innerText = "Bültende şu an aktif maç bulunamadı.";
                    return;
                }

                statusEl.innerHTML = `<span style="color:#4ade80">Toplam ${events.length} İddaa Maçı Yüklendi</span>`;
                let html = "";

                events.slice(0, 100).forEach(m => {
                    const code = m.c || m.code || '---';
                    const league = m.l || m.leagueName || 'İDDAA';
                    const home = m.h || m.homeTeam || 'Ev Sahibi';
                    const away = m.a || m.awayTeam || 'Deplasman';
                    const ms1 = m.o1 || m.ms1 || '1.80';
                    const msX = m.oX || m.msX || '3.20';
                    const ms2 = m.o2 || m.ms2 || '3.10';

                    html += `
                        <div class="match-card">
                            <div class="match-meta">
                                <span>${league}</span>
                                <span class="code-badge">Kod: ${code}</span>
                            </div>
                            <div class="teams">
                                <span>${home}</span>
                                <span class="versus">vs</span>
                                <span>${away}</span>
                            </div>
                            <div class="odds-container">
                                <div class="odd-box">
                                    <span class="odd-label">MS 1</span>
                                    <span class="odd-value">${ms1}</span>
                                </div>
                                <div class="odd-box">
                                    <span class="odd-label">MS X</span>
                                    <span class="odd-value">${msX}</span>
                                </div>
                                <div class="odd-box">
                                    <span class="odd-label">MS 2</span>
                                    <span class="odd-value">${ms2}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                bultenEl.innerHTML = html;

            } catch (err) {
                statusEl.innerHTML = `<span style="color:#f87171">Bülten çekilirken hata oluştu: ${err.message}</span>`;
            }
        }

        loadBulten();
    </script>
</body>
</html>
