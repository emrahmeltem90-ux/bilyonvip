<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>SkorLab v9 PRO</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="app-header">
  <div class="logo">⚽ SKORLAB <span class="v">v9</span></div>
  <div id="weekTitle" class="week">Yükleniyor...</div>
  <div class="kasa-box">
    <span>💰 Kasa:</span>
    <input type="number" id="kasaInput" value="1000" step="50" oninput="kasaGuncelle(this.value)">
    <span>TL</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="switchTab(1,this)">📋 Bülten</button>
  <button class="tab" onclick="switchTab(2,this)">🎯 Serbest</button>
  <button class="tab" onclick="switchTab(3,this)">⚡ Kupon</button>
  <button class="tab" onclick="switchTab(4,this)">📊 Analiz</button>
  <button class="tab" onclick="switchTab(5,this)">🗂️ Arşiv</button>
</nav>

<main>

<!-- SAYFA 1: BÜLTEN -->
<section id="page-1" class="page active">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="statMac">0</div><div class="stat-lbl">MAÇ</div></div>
    <div class="stat-card"><div class="stat-val green" id="statBanko">0</div><div class="stat-lbl">BANKO</div></div>
    <div class="stat-card"><div class="stat-val orange" id="statCift">0</div><div class="stat-lbl">ÇİFT/ÜÇLÜ</div></div>
    <div class="stat-card"><div class="stat-val blue" id="statGuven">%0</div><div class="stat-lbl">ORT GÜVEN</div></div>
  </div>
  <div id="matchesList"></div>
</section>

<!-- SAYFA 2: SERBEST -->
<section id="page-2" class="page">
  <div class="page-actions">
    <button class="btn btn-green" onclick="openSerbestModal()">➕ Maç Ekle</button>
    <button class="btn btn-red" onclick="temizleSerbest()">🗑️ Temizle</button>
  </div>
  <div id="serbestListesi"></div>
</section>

<!-- SAYFA 3: KUPON -->
<section id="page-3" class="page">
  <div class="card">
    <label class="lbl-lg">Bütçe (TL)</label>
    <input type="number" id="budget" value="200" step="10" oninput="updateKolon()" class="input-big">
    <div class="kolon-info">
      <span id="lblCost">200 TL</span> → <b id="lblKolon">20</b> kolon
    </div>

    <div class="mode-selector">
      <div class="mode active" id="kuponKaynak-toto" onclick="setKuponKaynak('toto',this)">Toto</div>
      <div class="mode" id="kuponKaynak-iddaa" onclick="setKuponKaynak('iddaa',this)">İddaa</div>
      <div class="mode" id="kuponKaynak-karisik" onclick="setKuponKaynak('karisik',this)">Karışık</div>
    </div>

    <div class="mode-selector">
      <div class="mode" id="mode-guvenli" onclick="setRiskMode('guvenli',this)">🛡️ Güvenli</div>
      <div class="mode active" id="mode-dengeli" onclick="setRiskMode('dengeli',this)">⚖️ Dengeli</div>
      <div class="mode" id="mode-agresif" onclick="setRiskMode('agresif',this)">🚀 Agresif</div>
    </div>
    <div id="modeInfo" class="mode-info"><b>⚖️ DENGELİ</b><br>Banko + çift karışık.</div>

    <button class="btn btn-blue btn-lg" onclick="kuponOlustur()" style="margin-top:14px">⚡ KUPON OLUŞTUR</button>
  </div>
  <div id="kuponSonuc"></div>
</section>

<!-- SAYFA 4: ANALİZ -->
<section id="page-4" class="page">
  <div class="card">
    <button class="btn btn-orange btn-lg" onclick="tahminVer()">📊 TAHMİN RAPORU</button>
  </div>
  <div id="tahminListesi"></div>
</section>

<!-- SAYFA 5: ARŞİV -->
<section id="page-5" class="page">
  <div class="card">
    <div class="result-title">🗂️ GEÇMİŞ HAFTALAR</div>
    <div id="arsivListesi"><div class="muted">Yükleniyor...</div></div>
  </div>
</section>

</main>

<!-- MODAL: SERBEST MAÇ EKLE -->
<div class="modal" id="serbestModal">
  <div class="modal-content">
    <div class="modal-head"><span>➕ SERBEST MAÇ EKLE</span><button onclick="closeModal('serbestModal')">✖</button></div>
    <div class="modal-body">
      <label>Maç Adı</label>
      <input type="text" id="sm-match" placeholder="Örn: Galatasaray - Fenerbahçe">
      <div class="oran-grid-3">
        <div><label>1</label><input type="number" step="0.01" id="sm-o1"></div>
        <div><label>X</label><input type="number" step="0.01" id="sm-oX"></div>
        <div><label>2</label><input type="number" step="0.01" id="sm-o2"></div>
      </div>
      <div class="accordion">
        <div class="acc-head">🎲 Ek Bahisler (Opsiyonel)</div>
        <div class="oran-grid-3">
          <div><label>KG Var</label><input type="number" step="0.01" id="sm-kgvar"></div>
          <div><label>KG Yok</label><input type="number" step="0.01" id="sm-kgyok"></div>
          <div><label>KGÜ</label><input type="number" step="0.01" id="sm-kgu"></div>
          <div><label>1.5 Alt</label><input type="number" step="0.01" id="sm-u15alt"></div>
          <div><label>1.5 Üst</label><input type="number" step="0.01" id="sm-u15ust"></div>
          <div><label>2.5 Alt</label><input type="number" step="0.01" id="sm-u25alt"></div>
          <div><label>2.5 Üst</label><input type="number" step="0.01" id="sm-u25ust"></div>
          <div><label>3.5 Alt</label><input type="number" step="0.01" id="sm-u35alt"></div>
          <div><label>3.5 Üst</label><input type="number" step="0.01" id="sm-u35ust"></div>
        </div>
      </div>
      <button class="btn btn-green btn-lg" onclick="serbestEkle()" style="margin-top:12px">✅ EKLE</button>
    </div>
  </div>
</div>

<!-- MODAL: MAÇ DETAY -->
<div class="modal" id="macDetayModal">
  <div class="modal-content">
    <div class="modal-head"><span id="macDetayTitle">Maç Detay</span><button onclick="closeModal('macDetayModal')">✖</button></div>
    <div class="modal-body" id="macDetayBody"></div>
  </div>
</div>

<!-- MODAL: TAHMİN RAPORU -->
<div class="modal" id="tahminModal">
  <div class="modal-content">
    <div class="modal-head"><span>📊 TAHMİN RAPORU</span><button onclick="closeModal('tahminModal')">✖</button></div>
    <div class="modal-body" id="tahminModalBody"></div>
  </div>
</div>

<!-- MODAL: TOAST -->
<div class="modal" id="toastModal">
  <div class="modal-content small">
    <div class="modal-body center">
      <div id="toastIcon" style="font-size:2.5rem">✅</div>
      <div id="toastTitle" style="font-weight:900;margin:8px 0"></div>
      <div id="toastMsg" class="muted"></div>
      <button class="btn btn-blue" onclick="closeModal('toastModal')" style="margin-top:12px">TAMAM</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
