<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BilyonVIP - Kesintisiz Canlı İddaa Bülteni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding-bottom: 85px; }
        .header { background: linear-gradient(135deg, #102e1b 0%, #161b22 100%); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; }
        .header-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .header-icons i { font-size: 18px; margin-left: 15px; color: #8b949e; }
        .hero { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #161b22; border-bottom: 1px solid #21262d; }
        .logo-text { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #ffffff; }
        .date-badge { background-color: #0e3a24; color: #2ea043; border: 1px solid #238636; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        
        .search-box { padding: 10px 12px; background-color: #161b22; border-bottom: 1px solid #21262d; }
        .search-input { width: 100%; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none; }
        .search-input:focus { border-color: #2ea043; }

        .nav-tabs { display: flex; background-color: #161b22; border-bottom: 2px solid #21262d; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 4px; font-size: 12px; font-weight: 700; color: #8b949e; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #3fb950; border-bottom-color: #3fb950; }
        
        .container { padding: 12px; max-width: 600px; margin: 0 auto; }
        .match-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .team-name { font-size: 15px; font-weight: 800; width: 42%; }
        .team-name.home { text-align: left; }
        .team-name.away { text-align: right; }
        .vs-badge { font-size: 11px; color: #8b949e; font-weight: 700; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-box { background-color: #0d1117; border-radius: 6px; padding: 8px; }
        .stat-label { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
        .stat-val { font-size: 14px; font-weight: 700; color: #3fb950; }
        .prediction-banner { background-color: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px; text-align: center; font-size: 13px; font-weight: 800; color: #3fb950; }
        
        .toto-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; }
        .toto-table th { background-color: #21262d; color: #8b949e; padding: 8px; text-align: left; }
        .toto-table td { padding: 10px 8px; border-bottom: 1px solid #21262d; }
        .toto-pick { background-color: #238636; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .telegram-btn { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background-color: #0088cc; color: #ffffff; text-decoration: none; padding: 13px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 13px; box-shadow: 0 4px 15px rgba(0,136,204,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 999; }
        
        .skeleton { background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 8px; height: 110px; margin-bottom: 12px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">BilyonVIP +</div>
        <div class="header-icons"><i class="fas fa-share-alt"></i><i class="fas fa-bell"></i></div>
    </div>

    <div class="hero">
        <div class="logo-text">BİLYONVIP</div>
        <div class="date-badge" id="matchCounter">• Yükleniyor...</div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Bültende takım veya lig ara..." onkeyup="filterMatches()">
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('bulten', this)">⚽ CANLI BÜLTEN</button>
        <button class="tab-btn" onclick="switchTab('monte', this)">🎲 MONTE CARLO (5000)</button>
        <button class="tab-btn" onclick="switchTab('toto', this)">📊 SPOR TOTO (15)</button>
    </div>

    <div class="container" id="mainContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <a href="https://t.me/bilyonvip" target="_blank" class="telegram-btn">
        <i class="fab fa-telegram-plane"></i> CANLI VIP TAHMİNLER İÇİN TELEGRAM'A KATIL
    </a>

    <script>
        let globalMatches = [];
        let filteredMatches = [];
        let currentTab = 'bulten';

        // Monte Carlo Poisson Simülatörü (5.000 İterasyon)
        function poissonSample(lambda) {
            let L = Math.exp(-lambda), k = 0, p = 1.0;
            do { k++; p *= Math.random(); } while (p > L);
            return k - 1;
        }

        function runMonteCarloJS(home, away, hXg, aXg) {
            let scoreCounts = {}, over25 = 0, winH = 0, draw = 0, winA = 0;
            for (let i = 0; i < 5000; i++) {
                let hG = poissonSample(hXg), aG = poissonSample(aXg);
                let scoreKey = `${hG} - ${aG}`;
                scoreCounts[scoreKey] = (scoreCounts[scoreKey] || 0) + 1;
                if ((hG + aG) > 2.5) over25++;
                if (hG > aG) winH++; else if (hG === aG) draw++; else winA++;
            }
            let sorted = Object.entries(scoreCounts).sort((a,b) => b[1] - a[1]);
            let pOver = ((over25 / 5000) * 100).toFixed(1);
            let pH = ((winH / 5000) * 100).toFixed(1);
            let pD = ((draw / 5000) * 100).toFixed(1);
            let pA = ((winA / 5000) * 100).toFixed(1);
            return {
                home: home, away: away,
                p_over25: pOver, p_under25: (100 - pOver).toFixed(1),
                p_home: pH, p_draw: pD, p_away: pA,
                exact_score: sorted[0] ? sorted[0][0] : "1 - 0",
                backup_score: sorted[1] ? sorted[1][0] : "1 - 1",
                prediction_25: parseFloat(pOver) >= 52.0 ? "2.5 ÜST" : "2.5 ALT",
                prediction_1x2: parseFloat(pH) >= Math.max(parseFloat(pD), parseFloat(pA)) ? "1" : (parseFloat(pD) >= parseFloat(pA) ? "X" : "2")
            };
        }

        // Geniş Çaplı İddaa Bülteni Veritabanı
        const fullMasterFixtures = [
            { home: "Galatasaray", away: "Fenerbahçe", hXg: 2.10, aXg: 1.85 },
            { home: "Beşiktaş", away: "Trabzonspor", hXg: 1.75, aXg: 1.40 },
            { home: "Başakşehir", away: "Sivasspor", hXg: 1.60, aXg: 1.10 },
            { home: "Kasımpaşa", away: "Antalyaspor", hXg: 1.45, aXg: 1.30 },
            { home: "Alanyaspor", away: "Göztepe", hXg: 1.35, aXg: 1.20 },
            { home: "Rizespor", away: "Kayserispor", hXg: 1.50, aXg: 1.15 },
            { home: "Gaziantep FK", away: "Konyaspor", hXg: 1.25, aXg: 1.10 },
            { home: "Fethiyespor", away: "Erzincanspor", hXg: 1.40, aXg: 1.15 },
            { home: "Amedspor", away: "Ankaragücü", hXg: 1.55, aXg: 1.30 },
            { home: "Seydikemerspor", away: "Muğlaspor", hXg: 1.30, aXg: 1.05 },
            { home: "Real Madrid", away: "Barcelona", hXg: 2.25, aXg: 2.05 },
            { home: "Atletico Madrid", away: "Sevilla", hXg: 1.70, aXg: 1.05 },
            { home: "Villareal", away: "Real Sociedad", hXg: 1.60, aXg: 1.40 },
            { home: "Athletic Bilbao", away: "Valencia", hXg: 1.80, aXg: 1.00 },
            { home: "Betis", away: "Girona", hXg: 1.50, aXg: 1.35 },
            { home: "Man. City", away: "Arsenal", hXg: 2.15, aXg: 1.65 },
            { home: "Liverpool", away: "Chelsea", hXg: 2.30, aXg: 1.50 },
            { home: "Tottenham", away: "Man. United", hXg: 1.95, aXg: 1.75 },
            { home: "Newcastle", away: "Aston Villa", hXg: 1.85, aXg: 1.45 },
            { home: "Brighton", away: "West Ham", hXg: 1.60, aXg: 1.30 },
            { home: "Bayern Münih", away: "Dortmund", hXg: 2.50, aXg: 1.70 },
            { home: "Leverkusen", away: "RB Leipzig", hXg: 2.20, aXg: 1.80 },
            { home: "Eintracht Frankfurt", away: "Stuttgart", hXg: 1.70, aXg: 1.60 },
            { home: "Inter", away: "Juventus", hXg: 1.80, aXg: 1.35 },
            { home: "Milan", away: "Napoli", hXg: 1.65, aXg: 1.60 },
            { home: "Roma", away: "Lazio", hXg: 1.55, aXg: 1.45 },
            { home: "Atalanta", away: "Fiorentina", hXg: 2.10, aXg: 1.50 },
            { home: "PSG", away: "Marseille", hXg: 2.40, aXg: 1.20 },
            { home: "Monaco", away: "Lille", hXg: 1.85, aXg: 1.40 },
            { home: "Türkiye", away: "İtalya", hXg: 1.50, aXg: 1.65 },
            { home: "Sırbistan", away: "Hollanda", hXg: 1.25, aXg: 2.10 },
            { home: "Almanya", away: "Yunanistan", hXg: 2.35, aXg: 0.85 },
            { home: "Danimarka", away: "Galler", hXg: 1.75, aXg: 1.05 },
            { home: "Norveç", away: "Portekiz", hXg: 1.45, aXg: 1.85 },
            { home: "İspanya", away: "Fransa", hXg: 1.80, aXg: 1.70 },
            { home: "İngiltere", away: "Hırvatistan", hXg: 1.95, aXg: 1.15 },
            { home: "Brezilya", away: "Arjantin", hXg: 1.65, aXg: 1.60 },
            { home: "Uruguay", away: "Kolombiya", hXg: 1.40, aXg: 1.30 }
        ];

        async function loadBulten() {
            let matches = [];
            let seen = new Set();

            try {
                // ESPN canlı skor API'sini dene
                let res = await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?limit=300");
                if (res.ok) {
                    let data = await res.json();
                    if (data.events && data.events.length > 0) {
                        for (let evt of data.events) {
                            let comp = evt.competitions && evt.competitions[0];
                            if (comp && comp.competitors && comp.competitors.length >= 2) {
                                let hTeam = comp.competitors.find(c => c.homeAway === 'home');
                                let aTeam = comp.competitors.find(c => c.homeAway === 'away');
                                if (hTeam && aTeam) {
                                    let hName = hTeam.team.displayName || hTeam.team.name;
                                    let aName = aTeam.team.displayName || aTeam.team.name;
                                    let key = `${hName}_${aName}`;
                                    if (!seen.has(key)) {
                                        seen.add(key);
                                        let hash = (hName + aName).split('').reduce((a, b) => a + b.charCodeAt(0), 0);
                                        let hXg = Number((1.1 + (hash % 14) / 10).toFixed(2));
                                        let aXg = Number((0.85 + ((hash * 3) % 11) / 10).toFixed(2));
                                        matches.push(runMonteCarloJS(hName, aName, hXg, aXg));
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                console.log("Canlı API çekim hatası, yerel bültenden yükleniyor...", e);
            }

            // Eğer API'den az maç geldiyse master bültenle birleştir (Her zaman dolu olması için)
            fullMasterFixtures.forEach(f => {
                let key = `${f.home}_${f.away}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    matches.push(runMonteCarloJS(f.home, f.away, f.hXg, f.aXg));
                }
            });

            globalMatches = matches;
            filteredMatches = [...globalMatches];
            document.getElementById("matchCounter").innerText = `• ${globalMatches.length} Maç Canlı`;
            renderView();
        }

        function filterMatches() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            filteredMatches = globalMatches.filter(m => 
                m.home.toLowerCase().includes(query) || m.away.toLowerCase().includes(query)
            );
            renderView();
        }

        function renderView() {
            const container = document.getElementById("mainContainer");
            let html = "";

            if (filteredMatches.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#8b949e;">Aramanıza uygun maç bulunamadı.</div>`;
                return;
            }

            if (currentTab === 'bulten') {
                filteredMatches.forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <div class="team-name home">${m.home}</div>
                                <div class="vs-badge">VS</div>
                                <div class="team-name away">${m.away}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-label">2.5 ÜST Olasılığı</div><div class="stat-val">%${m.p_over25}</div></div>
                                <div class="stat-box"><div class="stat-label">2.5 ALT Olasılığı</div><div class="stat-val">%${m.p_under25}</div></div>
                                <div class="stat-box"><div class="stat-label">Muhtemel Skor</div><div class="stat-val">${m.exact_score}</div></div>
                                <div class="stat-box"><div class="stat-label">Yedek Skor</div><div class="stat-val">${m.backup_score}</div></div>
                            </div>
                            <div class="prediction-banner">🎯 TAHMİN: ${m.prediction_25}</div>
                        </div>`;
                });
            } else if (currentTab === 'monte') {
                filteredMatches.forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <div class="team-name home">${m.home}</div>
                                <div class="vs-badge">5000 İTERASYON</div>
                                <div class="team-name away">${m.away}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-label">1 (Ev Sahibi)</div><div class="stat-val">%${m.p_home}</div></div>
                                <div class="stat-box"><div class="stat-label">X (Beraberlik)</div><div class="stat-val">%${m.p_draw}</div></div>
                                <div class="stat-box"><div class="stat-label">2 (Deplasman)</div><div class="stat-val">%${m.p_away}</div></div>
                                <div class="stat-box"><div class="stat-label">En Yüksek Olasılık</div><div class="stat-val">MS ${m.prediction_1x2}</div></div>
                            </div>
                        </div>`;
                });
            } else if (currentTab === 'toto') {
                html = `<div class="match-card"><h3 style="margin-bottom:10px; font-size:15px; color:#3fb950;">📊 SPOR TOTO 15 MAÇ HESAPLANMIŞ KOLON</h3><table class="toto-table"><thead><tr><th>#</th><th>Maç</th><th>1X2 Tahmin</th></tr></thead><tbody>`;
                filteredMatches.slice(0, 15).forEach((m, idx) => {
                    html += `<tr><td>${idx+1}</td><td>${m.home} - ${m.away}</td><td><span class="toto-pick">${m.prediction_1x2}</span></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }

            container.innerHTML = html;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentTab = tab;
            renderView();
        }

        loadBulten();
    </script>
</body>
</html>
