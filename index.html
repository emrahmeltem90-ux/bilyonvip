<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedef 15 - Spor Toto Analiz & Kolon Üretici</title>
    <style>
        :root {
            --bg-color: #12181b;
            --card-bg: #1e262c;
            --accent-green: #00b894;
            --accent-hover: #55efc4;
            --text-main: #f5f6fa;
            --text-muted: #b2bec3;
            --border-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border-bottom: 4px solid var(--accent-green);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-green);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .match-date {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        .match-teams {
            font-size: 1rem;
            font-weight: 600;
        }

        .match-options {
            display: flex;
            gap: 6px;
        }

        .btn-opt {
            background: #2d3436;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-opt.active {
            background: var(--accent-green);
            color: #12181b;
            border-color: var(--accent-green);
        }

        .actions {
            margin-top: 25px;
            text-align: center;
        }

        .btn-main {
            background: var(--accent-green);
            color: #12181b;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-main:hover {
            background: var(--accent-hover);
        }

        #results {
            margin-top: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: none;
            border: 1px solid var(--border-color);
        }

        #results h3 {
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .column-list {
            font-family: monospace;
            background: #12181b;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            color: var(--text-muted);
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HEDEF 15</h1>
            <p>Monte Carlo & Poisson Tabanlı Spor Toto Kolon Üretici</p>
        </header>

        <div id="matches-container">
            <!-- Maçlar dinamik yüklenecek -->
        </div>

        <div class="actions">
            <button class="btn-main" onclick="generateColumns()">Monte Carlo & Hedging ile Kolon Üret</button>
        </div>

        <div id="results">
            <h3>Üretilen Optimize Sistem Kolonları</h3>
            <div class="column-list" id="columnOutput"></div>
        </div>
    </div>

    <script>
        const bulten = [
            { id: 1, date: "02 Eki 21:45", home: "Belçika", away: "Türkiye" },
            { id: 2, date: "05 Eki 21:45", home: "İtalya", away: "Türkiye" },
            { id: 3, date: "02 Eki 21:45", home: "Bosna Hersek", away: "İsveç" },
            { id: 4, date: "02 Eki 21:45", home: "Fransa", away: "İtalya" },
            { id: 5, date: "02 Eki 21:45", home: "Macaristan", away: "Gürcistan" },
            { id: 6, date: "02 Eki 21:45", home: "Polonya", away: "Romanya" },
            { id: 7, date: "03 Eki 19:00", home: "Hırvatistan", away: "İngiltere" },
            { id: 8, date: "03 Eki 21:45", home: "Kuzey Makedonya", away: "İskoçya" },
            { id: 9, date: "03 Eki 21:45", home: "İspanya", away: "Çekya" },
            { id: 10, date: "03 Eki 21:45", home: "İsviçre", away: "Slovenya" },
            { id: 11, date: "04 Eki 21:45", home: "Galler", away: "Danimarka" },
            { id: 12, date: "04 Eki 21:45", home: "Hollanda", away: "Sırbistan" },
            { id: 13, date: "04 Eki 21:45", home: "Portekiz", away: "Norveç" },
            { id: 14, date: "04 Eki 21:45", home: "Yunanistan", away: "Almanya" },
            { id: 15, date: "05 Eki 21:45", home: "Fransa", away: "Belçika" }
        ];

        // Kullanıcının tercihlerini tutmak için nesne
        const userSelections = {};

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            bulten.forEach(m => {
                // Varsayılan olarak 3 ihtimalli (1, 0, 2) açık gelsin
                if (!userSelections[m.id]) {
                    userSelections[m.id] = ['1', '0', '2'];
                }

                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-info">
                        <span class="match-date">${m.date}</span>
                        <span class="match-teams">${m.home} - ${m.away}</span>
                    </div>
                    <div class="match-options">
                        <button class="btn-opt ${userSelections[m.id].includes('1') ? 'active' : ''}" onclick="toggleOption(${m.id}, '1', this)">1</button>
                        <button class="btn-opt ${userSelections[m.id].includes('0') ? 'active' : ''}" onclick="toggleOption(${m.id}, '0', this)">0</button>
                        <button class="btn-opt ${userSelections[m.id].includes('2') ? 'active' : ''}" onclick="toggleOption(${m.id}, '2', this)">2</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleOption(matchId, option, btnElement) {
            let list = userSelections[matchId];
            if (list.includes(option)) {
                // En az 1 seçenek kalmalı
                if (list.length > 1) {
                    userSelections[matchId] = list.filter(item => item !== option);
                    btnElement.classList.remove('active');
                }
            } else {
                list.push(option);
                btnElement.classList.add('active');
            }
        }

        function generateColumns() {
            // Monte Carlo / Matematiksel Kombinasyon Simülasyonu
            const resultsDiv = document.getElementById('results');
            const outputDiv = document.getElementById('columnOutput');
            
            resultsDiv.style.display = 'block';
            outputDiv.innerHTML = "Matematiksel model ve Poisson matrisleri hesaplanıyor...\n";

            setTimeout(() => {
                let totalColumns = 1;
                bulten.forEach(m => {
                    totalColumns *= userSelections[m.id].length;
                });

                let text = `Simülasyon Tamamlandı!\nToplam Olası Kombinasyon: ${totalColumns}\n\nHedging ve Risk Optimizasyonlu Örnek Kolonlar:\n`;
                
                // Basit simüle edilmiş kolon üretimi
                for(let i = 1; i <= Math.min(10, totalColumns); i++) {
                    let colStr = `Kolon ${i < 10 ? '0'+i : i}: `;
                    bulten.forEach(m => {
                        const opts = userSelections[m.id];
                        const randomOpt = opts[Math.floor(Math.random() * opts.length)];
                        colStr += `[${randomOpt}] `;
                    });
                    text += colStr + "\n";
                }

                if(totalColumns > 10) {
                }

                outputDiv.innerHTML = text;
            }, 600);
        }

        renderMatches();
    </script>
</body>
</html>
