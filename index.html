<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedef 15 - BankoBot Spor Toto Otomasyonu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --bot-bg: #1e1b4b;
            --bot-border: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 14px;
            border-bottom: 4px solid var(--accent-green);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2rem;
            color: var(--accent-green);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 3'lü Sekme Menüsü */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .control-group input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
        }

        .total-cost-badge {
            background: var(--bg-color);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .match-date {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        .match-teams {
            font-size: 1rem;
            font-weight: 600;
        }

        .match-options {
            display: flex;
            gap: 6px;
        }

        .btn-opt {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-opt.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .actions {
            margin-top: 25px;
            text-align: center;
        }

        .btn-main {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-main:hover {
            background: var(--accent-hover);
        }

        #results {
            margin-top: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: none;
            border: 1px solid var(--border-color);
        }

        #results h3 {
            color: var(--accent-green);
            margin-bottom: 12px;
        }

        .summary-info {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
            border-left: 4px solid var(--accent-green);
            line-height: 1.6;
        }

        .column-list {
            font-family: monospace;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            color: var(--text-main);
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        /* Analiz ve BankoBot Kartları */
        .analysis-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .analysis-card h4 {
            color: var(--accent-green);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .analysis-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .bot-card {
            background: var(--bot-bg);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid var(--bot-border);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .bot-card h4 {
            color: #818cf8;
            margin-bottom: 6px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bot-card .prediction-badge {
            display: inline-block;
            background: #4338ca;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .bot-card p {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HEDEF 15</h1>
            <p>Monte Carlo Simülasyonu & BankoBot Akıllı Spor Toto Sistemi</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bulten', this)">Bülten & Kolon</button>
            <button class="tab-btn" onclick="switchTab('analiz', this)">Maç Analizleri</button>
            <button class="tab-btn" onclick="switchTab('bankobot', this)">🤖 BankoBot</button>
        </div>

        <div id="tab-bulten" class="tab-content active">
            <div class="control-panel">
                <div class="control-group">
                    <label for="budgetInput">Bütçe Gir (TL):</label>
                    <input type="number" id="budgetInput" value="250" min="10" step="10" oninput="calculateColumnsFromBudget()">
                </div>
                <div class="control-group">
                    <label for="columnCountInput">Kaç Kolon Olsun? (Seç/Değiştir)</label>
                    <input type="number" id="columnCountInput" value="25" min="1" max="100" oninput="updateCost()">
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <div class="total-cost-badge" id="totalCostDisplay">Toplam Tutar: 250 TL (25 Kolon)</div>
            </div>

            <div id="matches-container">
                </div>

            <div class="actions">
                <button class="btn-main" onclick="generateColumns()">Uygula & Kolonları Oluştur</button>
            </div>

            <div id="results">
                <h3>Optimize Edilmiş Kupon Sonuçları</h3>
                <div class="summary-info" id="summaryText"></div>
                <div class="column-list" id="columnOutput"></div>
            </div>
        </div>

        <div id="tab-analiz" class="tab-content">
            <div id="analysis-container">
                </div>
        </div>

        <div id="tab-bankobot" class="tab-content">
            <div id="bot-container">
                </div>
        </div>
    </div>
