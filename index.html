<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİLYONVIP | Canlı Dev Bülten & YZ Tahminleri</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: rgba(18, 26, 43, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-cyan: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #22c55e;
            --accent-gold: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding-bottom: 120px; overflow-x: hidden; }

        .glow-bg {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(129, 140, 248, 0.05) 60%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .top-navbar {
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 22px; }
        .brand-text { background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .vip-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }

        .btn-reload {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .hero-banner {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-card);
        }
        .hero-title { font-size: 24px; font-weight: 800; }
        .hero-title span { color: var(--accent-cyan); }
        .hero-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        .controls-section { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .tabs-wrapper { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .tab-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-chip.active {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border-color: var(--accent-cyan);
        }

        .matches-feed { padding: 0 20px; }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 11px; }
        .league-title { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .tag-code { background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.2); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
        .tag-live { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 2px 8px; border-radius: 6px; font-weight: 800; }

        .teams-container { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .team-name { font-size: 14px; font-weight: 700; color: #fff; width: 42%; }
        .team-name.right { text-align: right; }
        .score-pill { background: #0b1120; border: 1px solid var(--border-card); padding: 4px 10px; border-radius: 8px; color: var(--accent-green); font-weight: 800; font-size: 13px; }

        .ai-prediction-box {
            background: rgba(129, 140, 248, 0.1);
            border: 1px dashed rgba(129, 140, 248, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-tag { color: var(--accent-purple); font-weight: 800; }
        .ai-val { color: var(--accent-gold); font-weight: 700; }

        .odds-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .odd-tile {
            background: #0b1120;
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
        }
        .odd-tile.selected {
            background: linear-gradient(135deg, #22c55e, #15803d);
            border-color: var(--accent-green);
        }
        .o-label { font-size: 10px; color: var(--text-secondary); display: block; }
        .o-val { font-size: 13px; color: var(--accent-cyan); font-weight: 800; }

        .slip-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(56, 189, 248, 0.3);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
        }
        .slip-odds-total { font-size: 18px; font-weight: 900; color: var(--accent-green); }
        .btn-confirm {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="top-navbar">
        <div class="brand">
            <span class="brand-text">BİLYONVIP</span>
            <span class="vip-badge">AI PRO</span>
        </div>
        <button class="btn-reload" onclick="initDashboard()">Yenile ↻</button>
    </div>

    <div class="hero-banner">
        <h1 class="hero-title">Canlı & <span>Yapay Zeka</span> Dev Bülten</h1>
        <p class="hero-subtitle">Dünya Ligleri, Uluslar Ligi & Spor Toto</p>
    </div>

    <div class="controls-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Takım, lig veya maç arayın..." oninput="renderMatches()">
        <div class="tabs-wrapper">
            <button class="tab-chip active" onclick="setFilter('all', this)">Tüm Bülten</button>
            <button class="tab-chip" onclick="setFilter('live', this)">🔴 Canlı Maçlar</button>
            <button class="tab-chip" onclick="setFilter('nations', this)">🇪🇺 UEFA Uluslar Ligi</button>
            <button class="tab-chip" onclick="setFilter('toto', this)">🎯 Spor Toto</button>
        </div>
    </div>
