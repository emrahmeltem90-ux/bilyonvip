<script>
const matchesData = [
    { id: 1, home: "Belçika", away: "Türkiye", date: "02 Eki 21:45", p1: "%64.2", p0: "%18.5", p2: "%17.3", comment: "Türkiye deplasmanda sürpriz yapmaya çok yakın, gizli 2 potansiyeli var." },
    { id: 2, home: "İtalya", away: "Türkiye", date: "05 Eki 21:45", p1: "%56.2", p0: "%24.7", p2: "%19.1", comment: "Herkes İtalya derken maç 0-2 bitebilir, dikkat." },
    { id: 3, home: "Bosna Hersek", away: "İsveç", date: "02 Eki 21:45", p1: "%17.6", p0: "%26.3", p2: "%56.1", comment: "İsveç ağır basıyor ama beraberlik matrisin kilit taşı." },
    { id: 4, home: "Fransa", away: "İtalya", date: "02 Eki 21:45", p1: "%78.8", p0: "%14.0", p2: "%7.2", comment: "Fransa evinde hata yapmaz, net banko." },
    { id: 5, home: "Macaristan", away: "Gürcistan", date: "02 Eki 21:45", p1: "%63.2", p0: "%24.1", p2: "%12.8", comment: "Macaristan iç sahasında rakibe şans tanımıyor." },
    { id: 6, home: "Polonya", away: "Romanya", date: "02 Eki 21:45", p1: "%64.5", p0: "%24.0", p2: "%11.5", comment: "Komple kapatılabilecek ters bir derbi havasında maç." },
    { id: 7, home: "Hırvatistan", away: "İngiltere", date: "03 Eki 21:45", p1: "%30.0", p0: "%30.0", p2: "%40.0", comment: "Sıkı bir mücadele, İngiltere bir adım önde." },
    { id: 8, home: "K.Makedonya", away: "İskoçya", date: "03 Eki 21:45", p1: "%25.0", p0: "%32.0", p2: "%43.0", comment: "Alt bitti gözüyle bakılan kapalı kutu maç." },
    { id: 9, home: "İspanya", away: "Çekya", date: "03 Eki 21:45", p1: "%70.0", p0: "%20.0", p2: "%10.0", comment: "İspanya pas oyunuyla fişi erken çeker." },
    { id: 10, home: "İsviçre", away: "Slovenya", date: "03 Eki 21:45", p1: "%52.0", p0: "%30.0", p2: "%18.0", comment: "Slovenya savunması kilitlenebilir, 0 ihtimali yüksek." },
    { id: 11, home: "Galler", away: "Danimarka", date: "04 Eki 21:45", p1: "%28.0", p0: "%30.0", p2: "%42.0", comment: "Danimarka deplasmanda zorlanır ama kazanmasını bilir." },
    { id: 12, home: "Hollanda", away: "Sırbistan", date: "04 Eki 21:45", p1: "%53.0", p0: "%27.0", p2: "%20.0", comment: "Sırbistan ters gelebilir, çifte şans denenmeli." },
    { id: 13, home: "Portekiz", away: "Norveç", date: "04 Eki 21:45", p1: "%56.0", p0: "%26.0", p2: "%18.0", comment: "Portekiz hücum hattı maçı erken koparır." },
    { id: 14, home: "Yunanistan", away: "Almanya", date: "04 Eki 21:45", p1: "%20.0", p0: "%28.0", p2: "%52.0", comment: "Almanya favori olsa da temkinli yaklaşılmalı." },
    { id: 15, home: "Fransa", away: "Belçika", date: "04 Eki 21:45", p1: "%46.0", p0: "%29.0", p2: "%25.0", comment: "Dev eşleşmede sürpriz 2 ihtimali göz ardı edilemez." }
];

const userSelections = {};

function initApp(){
    const list = document.getElementById('matchesList');
    list.innerHTML = '';

    matchesData.forEach(m => {
        if(!userSelections[m.id]) userSelections[m.id] = ['1'];

        const div = document.createElement('div');
        div.className = 'match';
        div.innerHTML = `
            <div class="match-head">
                <span>${m.date}</span>
                <span>Maç #${m.id}</span>
            </div>
            <div class="teams">${m.home} - ${m.away}</div>
            <div class="probs">
                <div class="pick ${userSelections[m.id].includes('1')?'selected':''}" onclick="toggleSelection(${m.id}, '1', this)">1 <span>${m.p1}</span></div>
                <div class="pick ${userSelections[m.id].includes('0')?'selected':''}" onclick="toggleSelection(${m.id}, '0', this)">0 <span>${m.p0}</span></div>
                <div class="pick ${userSelections[m.id].includes('2')?'selected':''}" onclick="toggleSelection(${m.id}, '2', this)">2 <span>${m.p2}</span></div>
            </div>
        `;
        list.appendChild(div);
    });

    initAnalysis();
}

function toggleSelection(matchId, val, el){
    let arr = userSelections[matchId];
    if(arr.includes(val)){
        if(arr.length > 1){
            userSelections[matchId] = arr.filter(x => x !== val);
            el.classList.remove('selected');
        } else {
            alert("En az 1 tahmin seçili olmalıdır!");
        }
    } else {
        arr.push(val);
        el.classList.add('selected');
    }
}

function initAnalysis(){
    const container = document.getElementById('analysisList');
    container.innerHTML = '';
    matchesData.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div class="teams" style="margin-bottom:6px;">${m.home} vs ${m.away}</div>
            <div class="system-line"><b>Bankobot Yorumu:</b> ${m.comment}</div>
        `;
        container.appendChild(div);
    });
}

function switchTab(index, el){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

    el.classList.add('active');
    document.getElementById(`page-${index}`).classList.add('active');
}

function generateCoupons(){
    const unitPrice = 10; // Kolon başı sabit fiyat (10 TL)
    const count = parseInt(document.getElementById('columnCountInput').value) || 1;
    const outputCard = document.getElementById('outputCard');
    const summary = document.getElementById('outputSummary');
    const container = document.getElementById('outputContainer');

    outputCard.style.display = 'block';

    let totalBudget = count * unitPrice;
    summary.innerHTML = `Toplam Tutar: <b>${totalBudget} TL</b> | Kolon Adedi: <b>${count}</b> | Kolon Başı: <b>${unitPrice}.00 TL (1.0 Misli)</b>`;

    let html = '';
    for(let i = 1; i <= count; i++){
        let matchStr = '';
        matchesData.forEach((m, idx) => {
            let picks = userSelections[m.id] || ['1'];
            // Her kolon için seçilen tahminler arasından farklı kombinasyon üretilmesi sağlanır
            let chosen = picks[(idx + i) % picks.length];
            matchStr += `M${idx+1}:[<b>${chosen}</b>] `;
        });

        html += `
            <div class="coupon">
                <b>Kolon #${i < 10 ? '0'+i : i}</b> (${unitPrice}.00 TL - 1.0 Misli)<br>
                <span class="muted" style="font-size:0.72rem;">${matchStr}</span>
            </div>
        `;
    }
    container.innerHTML = html;
}

function runSimulation(id){
    const bar = document.getElementById(`bar-${id}`);
    const res = document.getElementById(`res-${id}`);
    bar.style.width = '0%';
    res.innerHTML = 'Simülasyon çalıştırılıyor...';

    let progress = 0;
    let interval = setInterval(() => {
        progress += 20;
        bar.style.width = progress + '%';
        if(progress >= 100){
            clearInterval(interval);
            if(id === 1){
                res.innerHTML = '<b class="green">Sonuç:</b> 10.000 iterasyon sonucunda matris başarı oranı <b class="orange">%79.4</b> olarak doğrulandı.';
            } else {
                res.innerHTML = '<b class="green">Sonuç:</b> Varyans analizi tamamlandı. Risk seviyesi optimum düzeyde, çifte şanslar kuponu koruyor.';
            }
        }
    }, 150);
}

window.onload = initApp;
</script>
