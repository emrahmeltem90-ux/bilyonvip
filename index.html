<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedef 15 - BankoBot Spor Toto Otomasyonu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --bot-bg: #1e1b4b;
            --bot-border: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 18px;
            background: var(--card-bg);
            border-radius: 12px;
            border-bottom: 4px solid var(--accent-green);
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Sekme Menüsü */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Kontrol Paneli */
        .control-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .control-group input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .control-group input:focus {
            border-color: var(--accent-green);
        }

        .total-cost-badge {
            background: var(--bg-color);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        @media(min-width: 500px) {
            .match-card {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .match-date {
            font-size: 0.7rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        .match-teams {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .match-options {
            display: flex;
            gap: 6px;
        }

        .btn-opt {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .btn-opt.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        .actions {
            margin-top: 20px;
            text-align: center;
        }

        .btn-main {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-main:hover {
            background: var(--accent-hover);
        }

        #results {
            margin-top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: none;
            border: 1px solid var(--border-color);
        }

        #results h3 {
            color: var(--accent-green);
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .summary-info {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-green);
            line-height: 1.5;
        }

        .coupon-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .coupon-title {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .coupon-matches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            text-align: center;
        }

        .match-badge {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .match-badge span {
            display: block;
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .match-badge strong {
            color: var(--accent-green);
            font-size: 0.85rem;
        }

        .analysis-card, .bot-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .bot-card {
            background: var(--bot-bg);
            border-color: var(--bot-border);
        }

        .analysis-card h4, .bot-card h4 {
            color: var(--accent-green);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .bot-card h4 {
            color: #818cf8;
        }

        .prediction-badge {
            display: inline-block;
            background: #4338ca;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .analysis-card p, .bot-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .bot-card p {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HEDEF 15</h1>
            <p>Monte Carlo Simülasyonu & BankoBot Akıllı Spor Toto Sistemi</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bulten', this)">Bülten & Kolon</button>
            <button class="tab-btn" onclick="switchTab('analiz', this)">Maç Analizleri</button>
            <button class="tab-btn" onclick="switchTab('bankobot', this)">🤖 BankoBot</button>
        </div>
